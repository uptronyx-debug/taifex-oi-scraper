name: cf-test
on:
  push:
    branches: [cf-test]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          (npx --yes wrangler@4 --version; npx --yes wrangler@4 deploy --dry-run --outdir /tmp/out) > probe_output.txt 2>&1 || true
          (npx --yes wrangler@4 dev --port 8787 > /tmp/dev.log 2>&1 &) ; sleep 25
          for u in / /index.html /preview.html /logo-dark.svg /data/etf_fut.csv /.git/HEAD /.git/config /scraper.py /tools/run_all.py /wrangler.jsonc /.assetsignore /.github/workflows/daily_scrape.yml /requirements.txt /nope; do
            echo "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787$u) $u" >> probe_output.txt; done
          tail -5 /tmp/dev.log >> probe_output.txt
          git config user.name bot && git config user.email bot@x
          git checkout -q --orphan probe-output && git rm -rq --cached . && git add -f probe_output.txt && git commit -qm out
          git push -f origin probe-output
