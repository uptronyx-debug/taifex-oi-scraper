name: 每日抓取 TAIFEX 臺指選擇權資料

on:
  schedule:
    # 主要靠 Google Apps Script 準時觸發；這裡的排程只是備援（GitHub 排程常延遲數小時）
    - cron: "30 7 * * 1-5"
    - cron: "30 8 * * 1-5"
    - cron: "0 10 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 取出 repo 程式碼
        uses: actions/checkout@v4

      # 週末、證交所公布的休市日、今天已經全部抓完 → 直接略過（綠勾）
      - name: 檢查今天要不要抓
        id: check
        run: python3 tools/check_today.py pre

      - name: 設定 Python
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        if: steps.check.outputs.skip != 'true'
        run: pip install -r requirements.txt

      # 每支爬蟲都會自己略過已經有的日期；沒資料不會報錯，其中一支出問題也不影響其他支
      - name: 執行爬蟲（選擇權三大法人未平倉）
        if: ${{ !cancelled() && steps.check.outputs.skip != 'true' }}
        run: python scraper.py

      - name: 執行爬蟲（選擇權各履約價未平倉量）
        if: ${{ !cancelled() && steps.check.outputs.skip != 'true' }}
        run: python scraper_by_strike.py

      - name: 執行爬蟲（期貨三大法人未平倉）
        if: ${{ !cancelled() && steps.check.outputs.skip != 'true' }}
        run: python scraper_futures.py

      - name: 執行爬蟲（大台各月份未沖銷量）
        if: ${{ !cancelled() && steps.check.outputs.skip != 'true' }}
        run: python scraper_tx_months.py

      - name: 執行爬蟲（現貨三大法人買賣超）
        if: ${{ !cancelled() && steps.check.outputs.skip != 'true' }}
        run: python scraper_spot.py

      - name: 把新資料 commit 回 repo
        if: ${{ !cancelled() && steps.check.outputs.skip != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          git diff --staged --quiet && echo "沒有新資料，不需要 commit" || git commit -m "auto: 更新 TAIFEX 資料 $(date +'%Y-%m-%d')"
          git push

      # 17:00 後還有部分資料缺漏才報紅叉；全部都沒有（尚未公布／臨時休市）不算錯
      - name: 檢查今天資料是否齊全
        if: ${{ !cancelled() && steps.check.outputs.skip != 'true' }}
        run: python3 tools/check_today.py post
