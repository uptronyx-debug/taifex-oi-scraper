name: 每日抓取 TAIFEX 臺指選擇權資料

on:
  schedule:
    # 主要靠 Google Apps Script 準時觸發；這裡的排程只是備援（GitHub 排程常延遲數小時）
    - cron: "30 7 * * 1-5"
    - cron: "30 8 * * 1-5"
    - cron: "0 10 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # 用來啟動晚間鬧鐘

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      TZ: Asia/Taipei   # 讓爬蟲的「今天」以台北日期為準
    steps:
      - name: 取出 repo 程式碼
        uses: actions/checkout@v4

      # 週末、證交所公布的休市日、今天已經全部抓完 → 直接略過（綠勾）
      - name: 檢查今天要不要抓
        id: check
        run: python3 tools/check_today.py pre

      - name: 設定 Python
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        if: steps.check.outputs.skip != 'true'
        run: pip install -r requirements.txt

      # 盤後輪詢：每分鐘跑一次，資料一公布就立刻寫入並推送，直到五份到齊或 15:40
      - name: 盤後輪詢抓取（資料一公布就更新）
        if: ${{ !cancelled() && steps.check.outputs.skip != 'true' }}
        run: python tools/run_all.py

      # 17:00 後還有部分資料缺漏才報紅叉；全部都沒有（尚未公布／臨時休市）不算錯
      - name: 檢查今天資料是否齊全
        if: ${{ !cancelled() && steps.check.outputs.skip != 'true' }}
        run: python3 tools/check_today.py post

      # 不依賴 Google Apps Script：啟動晚間鬧鐘，晚上自動觸發融資抓取（平日才啟動）
      - name: 啟動晚間鬧鐘
        if: ${{ always() && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$(date +%u)" -le 5 ] && [ "$(date +%H)" -lt 21 ] || { echo "週末或已過 21 點，不啟動"; exit 0; }
          gh api -X POST repos/${{ github.repository }}/actions/workflows/evening_alarm.yml/dispatches -f ref=main && echo "已啟動晚間鬧鐘"
