name: 每日抓取 TAIFEX 臺指選擇權資料

on:
  schedule:
    - cron: "45 7 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 取出 repo 程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行爬蟲（三大法人未平倉）
        run: python scraper.py

      - name: 執行爬蟲（各履約價未平倉量）
        run: python scraper_by_strike.py

      - name: 把新資料 commit 回 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/txo_oi.csv data/txo_strike_oi.csv
          git diff --staged --quiet && echo "沒有新資料，不需要 commit" || git commit -m "auto: 更新 TAIFEX 資料 $(date +'%Y-%m-%d')"
          git push
