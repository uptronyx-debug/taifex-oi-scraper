name: 每日抓取 TAIFEX 臺指選擇權資料

on:
  schedule:
    # 台灣時間 15:30、16:30、18:00（UTC 07:30、08:30、10:00），週一到週五
    # 排一天多次是因為 GitHub 排程會延遲或偶爾跳過；已經抓到的話後面幾次會自動略過
    - cron: "30 7 * * 1-5"
    - cron: "30 8 * * 1-5"
    - cron: "0 10 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 取出 repo 程式碼
        uses: actions/checkout@v4

      - name: 檢查今天是否已經抓過
        id: check
        run: |
          TODAY_SLASH=$(TZ=Asia/Taipei date +%Y/%m/%d)
          TODAY_DASH=$(TZ=Asia/Taipei date +%Y-%m-%d)
          if grep -qE "^($TODAY_SLASH|$TODAY_DASH)," data/txo_oi.csv 2>/dev/null \
             && grep -qE "^($TODAY_SLASH|$TODAY_DASH)," data/txo_strike_oi.csv 2>/dev/null; then
            echo "今天已經有資料，略過"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 設定 Python
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        if: steps.check.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: 執行爬蟲（三大法人未平倉）
        if: steps.check.outputs.skip != 'true'
        run: python scraper.py

      - name: 執行爬蟲（各履約價未平倉量）
        if: steps.check.outputs.skip != 'true'
        run: python scraper_by_strike.py

      - name: 把新資料 commit 回 repo
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/txo_oi.csv data/txo_strike_oi.csv
          git diff --staged --quiet && echo "沒有新資料，不需要 commit" || git commit -m "auto: 更新 TAIFEX 資料 $(date +'%Y-%m-%d')"
          git push
