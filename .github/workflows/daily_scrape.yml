name: 每日抓取 TAIFEX 臺指選擇權資料

on:
  schedule:
    # 台灣時間 15:30、16:30、18:00（UTC 07:30、08:30、10:00），週一到週五
    # 主要靠 Google Apps Script 準時觸發；這裡的排程只是備援。已經抓到的話會自動略過
    - cron: "30 7 * * 1-5"
    - cron: "30 8 * * 1-5"
    - cron: "0 10 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 取出 repo 程式碼
        uses: actions/checkout@v4

      - name: 檢查今天是否已經全部抓過
        id: check
        run: |
          TODAY=$(TZ=Asia/Taipei date +%Y/%m/%d)
          missing=0
          for f in data/txo_oi.csv data/txo_strike_oi.csv data/fut_oi.csv data/spot_net.csv data/tx_month_oi.csv; do
            if ! grep -q "^$TODAY," "$f" 2>/dev/null; then echo "$f 還沒有 $TODAY 的資料"; missing=1; fi
          done
          if [ "$missing" = "0" ]; then
            echo "今天的資料都已經有了，略過"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 設定 Python
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        if: steps.check.outputs.skip != 'true'
        run: pip install -r requirements.txt

      # 每支爬蟲都會自己略過已經有的日期；其中一支失敗也不影響其他支和 commit
      - name: 執行爬蟲（選擇權三大法人未平倉）
        if: ${{ !cancelled() && steps.check.outputs.skip != 'true' }}
        run: python scraper.py

      - name: 執行爬蟲（選擇權各履約價未平倉量）
        if: ${{ !cancelled() && steps.check.outputs.skip != 'true' }}
        run: python scraper_by_strike.py

      - name: 執行爬蟲（期貨三大法人未平倉）
        if: ${{ !cancelled() && steps.check.outputs.skip != 'true' }}
        run: python scraper_futures.py

      - name: 執行爬蟲（大台各月份未沖銷量）
        if: ${{ !cancelled() && steps.check.outputs.skip != 'true' }}
        run: python scraper_tx_months.py

      - name: 執行爬蟲（現貨三大法人買賣超）
        if: ${{ !cancelled() && steps.check.outputs.skip != 'true' }}
        run: python scraper_spot.py

      - name: 把新資料 commit 回 repo
        if: ${{ !cancelled() && steps.check.outputs.skip != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          git diff --staged --quiet && echo "沒有新資料，不需要 commit" || git commit -m "auto: 更新 TAIFEX 資料 $(date +'%Y-%m-%d')"
          git push
