name: 偵查資料來源（測試用，不寫資料）
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: 測試新爬蟲（寫到 out/，不碰 data/）
        env:
          DATA_DIR: out
        run: |
          {
            for d in 2026/10/16 2026/10/15 2026/10/09 2026/10/19; do
              echo "##### futures $d"; python scraper_futures.py --date $d || echo "exit=$?"
              echo "##### spot $d"; python scraper_spot.py --date $d || echo "exit=$?"
            done
            echo "##### fut_oi.csv"; cat out/fut_oi.csv
            echo "##### spot_net.csv"; cat out/spot_net.csv
          } > probe_output.txt 2>&1 || true
      - name: 把結果推到獨立分支 probe-output（不影響 main 與網頁）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe-output
          git rm -rq --cached .
          git add -f probe_output.txt
          git commit -qm "probe output"
          git push -f origin probe-output
