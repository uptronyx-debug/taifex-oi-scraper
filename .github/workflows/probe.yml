name: 偵查資料來源（測試用，不寫資料）
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python tools/probe.py > probe_output.txt 2>&1 || true
      - name: 把結果推到獨立分支 probe-output（不影響 main 與網頁）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe-output
          git rm -rq --cached .
          git add -f probe_output.txt
          git commit -qm "probe output"
          git push -f origin probe-output
