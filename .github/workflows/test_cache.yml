name: 測試 raw 快取（暫時）
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          U=https://raw.githubusercontent.com/${{ github.repository }}/main/cachetest.txt
          curl -s "$U" > /dev/null   # 先讓 CDN 快取舊版本
          echo "v-$(date +%s)" > cachetest.txt
          NEW=$(cat cachetest.txt)
          git config user.name bot && git config user.email bot@x
          git add cachetest.txt && git commit -qm "cache test" && git push -q
          PUSHED=$(date +%s)
          {
          echo "new=$NEW"
          for i in $(seq 1 20); do
            sleep 5
            A=$(curl -s "$U"); B=$(curl -s "$U?t=$RANDOM$RANDOM")
            C=$(curl -s -H "Accept: application/vnd.github.raw" "https://api.github.com/repos/${{ github.repository }}/contents/cachetest.txt?ref=main&t=$RANDOM")
            echo "+$(( $(date +%s) - PUSHED ))s plain=$A query=$B api=$C"
          done
          } > probe_output.txt 2>&1
          git checkout -q --orphan probe-output && git rm -rq --cached . && git add -f probe_output.txt && git commit -qm out && git push -qf origin probe-output
