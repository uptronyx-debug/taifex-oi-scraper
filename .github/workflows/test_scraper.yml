name: 測試（暫時，不寫入 data）
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: |
          python - > probe_output.txt 2>&1 <<'PY' || true
          import scraper_etf_fut as s
          for e, fn in s.SOURCES:
              for name, f in ((fn.__name__, fn), ("MoneyDJ", lambda e=e: s.moneydj(e))):
                  try: print(e, name, f())
                  except Exception as x: print(e, name, "ERR", x)
          PY
          git config user.name bot && git config user.email bot@x
          git checkout -q --orphan probe-output && git rm -rq --cached . && git add -f probe_output.txt && git commit -qm out
          git push -f origin probe-output
