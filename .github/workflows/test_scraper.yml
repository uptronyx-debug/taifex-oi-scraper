name: 測試（暫時，不寫入 data）
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - env:
          DATA_DIR: out
          TZ: Asia/Taipei
        run: |
          mkdir -p out
          {
          for d in 2026/11/06 2026/11/09 2026/10/23; do echo "##### $d"; python scraper_margin_top.py --date $d; python scraper_foreign_hold.py --date $d; done
          echo "##### top"; cat out/margin_top.csv
          echo "##### hold"; cat out/foreign_hold.csv
          } > probe_output.txt 2>&1 || true
          git config user.name bot && git config user.email bot@x
          git checkout -q --orphan probe-output && git rm -rq --cached . && git add -f probe_output.txt && git commit -qm out
          git push -f origin probe-output
