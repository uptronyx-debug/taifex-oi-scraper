name: 測試（暫時，不寫入 data）
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests pandas lxml
      - run: |
          python - > probe_output.txt 2>&1 <<'PY' || true
          import requests, re, io, pandas as pd
          H={"User-Agent":"Mozilla/5.0 Chrome/124","Referer":"https://www.taifex.com.tw/cht/3/callsAndPutsDate"}
          for url, data in [("https://www.taifex.com.tw/cht/3/callsAndPutsDate", {"queryDate":"2026/11/10","commodityId":""}),
                            ("https://www.taifex.com.tw/cht/3/callsAndPutsDate", {"queryDate":"2026/11/10","commodityId":"TXO"})]:
              r=requests.post(url,data=data,headers=H,timeout=30)
              t=re.sub(r"\s+"," ",re.sub(r"<[^>]+>"," ",r.text))
              print("=====",data, len(r.text))
              for m in re.finditer(r"臺指選擇權|週|TXO|W[12]|商品", t): pass
              i=t.find("臺指選擇權"); print(t[i-200:i+1500])
              opts=re.findall(r'<option[^>]*value="([^"]*)"[^>]*>([^<]*)</option>', r.text); print("OPTIONS", opts[:60])
          PY
          git config user.name bot && git config user.email bot@x
          git checkout -q --orphan probe-output && git rm -rq --cached . && git add -f probe_output.txt && git commit -qm out
          git push -f origin probe-output
