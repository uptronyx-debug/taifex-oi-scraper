name: 測試（暫時，不寫入 data）
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - run: |
          python - > probe_output.txt 2>&1 <<'PY' || true
          import scraper, requests, re
          for d in ["2025/11/04","2026/09/08","2026/11/12"]:
              r = scraper.fetch_one_day(d)
              print(d, len(r or []), (r or [None])[0])
          H=scraper.HEADERS
          for pl in [{"queryType":"1","doQuery":"1","queryDate":"2025/11/04","commodityId":""},{"queryDate":"2025/11/04","commodityId":""},{"queryDate":"2025/11/04","commodityId":"TXO"}]:
              t=requests.post(scraper.TARGET_URL,data=pl,headers=H,timeout=30).text
              m=re.search(r"日期\s*(\d{4}/\d{1,2}/\d{1,2})",t); print(pl, m and m.group(1))
          PY
          git config user.name bot && git config user.email bot@x
          git checkout -q --orphan probe-output && git rm -rq --cached . && git add -f probe_output.txt && git commit -qm out
          git push -f origin probe-output
