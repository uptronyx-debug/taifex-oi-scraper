name: 測試（暫時，不寫入 data）
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests playwright && python -m playwright install --with-deps chromium
      - run: |
          python tools/probe_etf.py > probe_output.txt 2>&1 || true
          git config user.name bot && git config user.email bot@x
          git checkout -q --orphan probe-output && git rm -rq --cached . && git add -f probe_output.txt && git commit -qm out
          git push -f origin probe-output
