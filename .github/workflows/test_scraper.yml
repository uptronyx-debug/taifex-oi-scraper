name: 測試（暫時，不寫入 data）
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - env:
          DATA_DIR: out
          TZ: Asia/Taipei
        run: |
          mkdir -p out
          {
          for d in 2026/10/28 2026/10/29 2026/10/23; do echo "##### $d"; python scraper_margin.py --date $d; done
          echo "##### backfill 09/24-10/02"; python scraper_margin.py --backfill 2026/09/24 2026/10/02
          echo "##### csv"; cat out/margin.csv
          } > probe_output.txt 2>&1 || true
          git config user.name bot && git config user.email bot@x
          git checkout -q --orphan probe-output && git rm -rq --cached . && git add -f probe_output.txt && git commit -qm out
          git push -f origin probe-output
