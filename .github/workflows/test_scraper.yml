name: 測試（暫時，不寫入 data）
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          {
          for u in "https://www.twse.com.tw/rwd/zh/marginTrading/MI_MARGN?date=20261028&selectType=MS&response=json" \
                   "https://www.twse.com.tw/rwd/zh/afterTrading/FMTQIK?date=20261001&response=json" \
                   "https://www.twse.com.tw/rwd/zh/marginTrading/MI_MARGN?date=20261029&selectType=MS&response=json"; do
            echo "##### $u"
            curl -sS -m 30 "$u" | python3 -c "import sys,json; j=json.load(sys.stdin); print(json.dumps({k:v for k,v in j.items() if k not in ('data','tables')}, ensure_ascii=False)[:600]); [print('TABLE', t.get('title'), t.get('fields'), t.get('data',[])[:6]) for t in j.get('tables',[])]; print('FIELDS', j.get('fields')); [print(r) for r in j.get('data',[])[:4]]"
            sleep 4
          done
          } > probe_output.txt 2>&1
          git init -q . && git config user.name bot && git config user.email bot@x
          git checkout -q --orphan probe-output && git add probe_output.txt && git commit -qm out
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-output
