name: 測試（暫時）
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: scrape
  cancel-in-progress: false
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: |
          python scraper_etf_fut.py
          git config user.name "uptronyx-debug"
          git config user.email "uptronyx-debug@users.noreply.github.com"
          git add data/etf_fut.csv
          git diff --cached --quiet || (git commit -m "auto: 補 00631L 口數" && git pull --rebase && git push)
