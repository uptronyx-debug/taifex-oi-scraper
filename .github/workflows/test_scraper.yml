name: 測試（暫時，不寫入 data）
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: |
          B=https://options.uptronyx.com
          for u in / /data/etf_fut.csv /favicon.svg /.git/HEAD /.git/config /scraper.py /tools/run_all.py /wrangler.jsonc /.github/workflows/daily_scrape.yml /requirements.txt; do
            echo "$(curl -s -o /dev/null -w '%{http_code}' $B$u) $u" >> probe_output.txt; done
          curl -sI $B/data/etf_fut.csv | grep -i "cache-control\|etag\|content-type" >> probe_output.txt
          python - >> probe_output.txt 2>&1 <<'PY' || true
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch()
              for w in (1100, 390):
                  pg = b.new_page(viewport={"width": w, "height": 900}); errs = []; bad = []
                  pg.on("pageerror", lambda e: errs.append(str(e)))
                  pg.on("response", lambda r: r.status >= 400 and bad.append((r.status, r.url)))
                  pg.goto("https://options.uptronyx.com/", wait_until="networkidle"); pg.wait_for_timeout(3000)
                  info = pg.evaluate("""() => ({title: document.title, date: document.querySelector('header')?.innerText.slice(0,80), fut: !!document.querySelector('#futBox svg'), hedge: !!document.querySelector('#hedgeBox svg'), etf: !!document.querySelector('#etfFutBox svg'), copy: document.querySelector('.foot-copy')?.innerText})""")
                  print(w, info, "errors", errs, "bad", bad)
                  for t in ("futures", "spot", "margin"):
                      pg.click(f".tab[data-tab={t}]"); pg.wait_for_timeout(300)
                  pg.screenshot(path=f"shot-{w}.png")
          PY
          git config user.name bot && git config user.email bot@x
          git checkout -q --orphan probe-output && git rm -rq --cached . && git add -f probe_output.txt shot-*.png && git commit -qm out
          git push -f origin probe-output
