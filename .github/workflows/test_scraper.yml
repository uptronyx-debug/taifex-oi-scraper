name: 測試（暫時）
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: scrape
  cancel-in-progress: false
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - run: |
          python scraper_taiex.py
          tail -3 data/taiex.csv
          git config user.name "uptronyx-debug"
          git config user.email "uptronyx-debug@users.noreply.github.com"
          git add data/taiex.csv
          git diff --cached --quiet || (git commit -m "auto: 加權指數收盤" && git pull --rebase && git push)
