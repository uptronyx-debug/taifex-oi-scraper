name: 測試（暫時，不寫入 data）
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - env:
          DATA_DIR: out
        run: |
          {
          for d in 2026/10/23 2026/10/26; do
            echo "##### $d"
            python scraper_futures.py --date $d || true
            python scraper_spot.py --date $d || true
            python scraper_tx_months.py --date $d || true
          done
          } > probe_output.txt 2>&1
          git config user.name bot && git config user.email bot@x
          git checkout -q --orphan probe-output && git rm -rq --cached . && git add -f probe_output.txt && git commit -qm out
          git push -f origin probe-output
