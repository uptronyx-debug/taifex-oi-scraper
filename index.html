<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台指選擇權法人籌碼儀表板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;600&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F151C;
    --surface:#1A232D;
    --surface-2:#212C38;
    --divider:#2A3644;
    --text:#ECE7DD;
    --text-muted:#8798A8;
    --long:#DE5B4B;      /* 買方 / 多方力道 */
    --long-soft:#4A2A28;
    --short:#3FA37C;     /* 賣方 / 空方力道 */
    --short-soft:#1E3B33;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Noto Sans TC', sans-serif;
    line-height:1.6;
    min-height:100vh;
  }
  .wrap{
    max-width:960px;
    margin:0 auto;
    padding:48px 24px 80px;
  }

  /* ---------- Header ---------- */
  header{
    display:flex;
    flex-wrap:wrap;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    padding-bottom:28px;
    border-bottom:1px solid var(--divider);
    margin-bottom:36px;
  }
  h1{
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size:28px;
    margin:0;
    letter-spacing:0.02em;
  }
  .meta{
    color:var(--text-muted);
    font-size:14px;
    text-align:right;
  }
  .meta .date{
    color:var(--text);
    font-family:'Roboto Mono', monospace;
    font-weight:500;
  }

  /* ---------- Status ---------- */
  #status{
    color:var(--text-muted);
    font-size:15px;
    padding:40px 0;
    text-align:center;
  }
  #status.error{color:var(--long);}

  /* ---------- Summary ---------- */
  #summary{
    background:var(--surface);
    border:1px solid var(--divider);
    border-left:3px solid var(--text-muted);
    border-radius:6px;
    padding:22px 24px;
    margin-bottom:24px;
  }
  #summary h2{
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size:17px;
    margin:0 0 14px;
  }
  .summary-lines{
    display:flex;
    flex-direction:column;
    gap:8px;
    font-size:15px;
  }
  .summary-lines .inst-tag{
    color:var(--text-muted);
    font-size:13px;
    margin-right:6px;
  }
  .summary-lines .pattern-plenum   { color:var(--text); }
  .summary-lines .pattern-burst    { color:var(--text); }
  .summary-lines .pattern-up       { color:var(--long); }
  .summary-lines .pattern-down     { color:var(--short); }
  .summary-agree{
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid var(--divider);
    font-size:14px;
  }
  .summary-agree.agree{ color:var(--text-muted); }
  .summary-agree.disagree{ color:#E0B84B; }
  .summary-note{
    margin-top:12px;
    font-size:12.5px;
    color:var(--text-muted);
    line-height:1.6;
  }

  /* ---------- Trend ---------- */
  #trend{
    background:var(--surface);
    border:1px solid var(--divider);
    border-radius:6px;
    padding:22px 24px;
    margin-bottom:24px;
  }
  #trend h2{
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size:17px;
    margin:0 0 14px;
  }
  #trend h3{
    font-family:'Noto Sans TC', sans-serif;
    font-weight:600;
    font-size:14px;
    color:var(--text-muted);
    margin:0 0 8px;
  }
  .trend-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
  }
  @media (max-width:700px){
    .trend-grid{grid-template-columns:1fr;}
  }
  .trend-inst{
    background:var(--surface-2);
    border:1px solid var(--divider);
    border-radius:6px;
    padding:16px;
  }
  .trend-legend{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:8px;
    font-size:11px;
    color:var(--text-muted);
  }
  .legend-item{ display:flex; align-items:center; gap:4px; }
  .swatch{
    display:inline-block;
    width:14px;
    height:0;
    border-top:2px solid;
  }
  .swatch.dash{ border-top-style:dashed; }

  .trend-table{
    width:100%;
    border-collapse:collapse;
    margin-top:8px;
    font-family:'Roboto Mono', monospace;
    font-size:11px;
  }
  .trend-table th, .trend-table td{
    padding:5px 4px;
    text-align:right;
    border-bottom:1px solid var(--divider);
    white-space:nowrap;
  }
  .trend-table th:first-child, .trend-table td:first-child{
    text-align:left;
    font-family:'Noto Sans TC', sans-serif;
    color:var(--text-muted);
  }
  .trend-table th{
    color:var(--text-muted);
    font-weight:500;
    font-size:11px;
  }

  /* ---------- Strike OI ---------- */
  #strikeSection{
    background:var(--surface);
    border:1px solid var(--divider);
    border-radius:6px;
    padding:22px 24px;
    margin-bottom:24px;
  }
  #strikeSection h2{
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size:17px;
    margin:0 0 6px;
  }
  .strike-sub{
    font-size:12px;
    color:var(--text-muted);
    margin-bottom:14px;
  }
  .strike-callouts{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:18px;
  }
  @media (max-width:700px){
    .strike-callouts{grid-template-columns:1fr;}
  }
  .callout{
    background:var(--surface-2);
    border:1px solid var(--divider);
    border-radius:6px;
    padding:12px 14px;
  }
  .callout-title{
    font-size:11px;
    color:var(--text-muted);
    margin-bottom:4px;
  }
  .callout-value{
    font-family:'Roboto Mono', monospace;
    font-size:18px;
    font-weight:700;
  }
  .callout-value.call{ color:var(--long); }
  .callout-value.put{ color:var(--short); }
  .callout-sub{
    font-size:11px;
    color:var(--text-muted);
    margin-top:2px;
  }

  .strike-chart{
    max-height:520px;
    overflow-y:auto;
  }
  .strike-row{
    display:grid;
    grid-template-columns:auto 1fr 64px 1fr auto;
    align-items:center;
    height:18px;
    margin-bottom:2px;
    gap:6px;
  }
  .strike-label-call, .strike-label-put{
    font-family:'Roboto Mono', monospace;
    font-size:11px;
    white-space:nowrap;
  }
  .strike-label-call{ text-align:right; color:var(--long); }
  .strike-label-put{ text-align:left; color:var(--short); }
  .delta-up{ color:var(--long); }
  .delta-down{ color:var(--short); }
  .strike-row.hi-call .strike-price{ color:var(--long); font-weight:700; }
  .strike-row.hi-put  .strike-price{ color:var(--short); font-weight:700; }
  .strike-call-cell{
    display:flex;
    justify-content:flex-end;
  }
  .strike-put-cell{
    display:flex;
    justify-content:flex-start;
  }
  .strike-bar-call{
    height:12px;
    background:var(--long);
    border-radius:3px 0 0 3px;
    opacity:0.85;
  }
  .strike-row.hi-call .strike-bar-call{ opacity:1; box-shadow:0 0 0 1px var(--long); }
  .strike-bar-put{
    height:12px;
    background:var(--short);
    border-radius:0 3px 3px 0;
    opacity:0.85;
  }
  .strike-row.hi-put .strike-bar-put{ opacity:1; box-shadow:0 0 0 1px var(--short); }
  .strike-price{
    text-align:center;
    font-family:'Roboto Mono', monospace;
    font-size:11px;
    color:var(--text-muted);
  }
  .strike-axis-labels{
    display:grid;
    grid-template-columns:auto 1fr 64px 1fr auto;
    gap:6px;
    font-size:10px;
    color:var(--text-muted);
    margin-bottom:6px;
  }
  .strike-axis-labels .call-label{ text-align:right; }
  .strike-axis-labels .put-label{ text-align:left; }

  /* ---------- Footer ---------- */
  footer{
    margin-top:40px;
    padding-top:20px;
    border-top:1px solid var(--divider);
    color:var(--text-muted);
    font-size:13px;
  }
  footer a{color:var(--text-muted);}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>台指選擇權法人籌碼儀表板</h1>
    <div class="meta">
      資料日期：<span class="date" id="dataDate">—</span><br>
      <span id="lastChecked"></span>
    </div>
  </header>

  <div id="status">資料載入中…</div>

  <div id="summary" style="display:none;"></div>
  <div id="trend" style="display:none;"></div>
  <div id="strikeSection" style="display:none;"></div>

  <footer>
    TAIFEX 三大法人 ｜ 單位：億元
  </footer>

</div>

<script>
const CSV_URL = "https://raw.githubusercontent.com/uptronyx-debug/taifex-oi-scraper/main/data/txo_oi.csv";

function parseCSV(text) {
  const lines = text.trim().split("\n");
  const headers = lines[0].split(",").map(h => h.trim());
  return lines.slice(1).map(line => {
    const cells = line.split(",");
    const row = {};
    headers.forEach((h, i) => row[h] = (cells[i] || "").trim());
    return row;
  });
}

function toYi(valueK) {
  // 原始單位是千元；1億 = 100,000 千元
  return Number(valueK) / 100000;
}

function fmtYi(n) {
  return n.toLocaleString("zh-Hant", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
}

const PATTERNS = {
  plenum: { label: "盤整型態", detail: "雙邊賣方（賣call+賣put）金額最大，傾向認為指數會維持區間整理。", cls: "pattern-plenum" },
  burst:  { label: "雙向噴出型態", detail: "雙邊買方（買call+買put）金額最大，傾向認為指數會出現大幅波動，但方向不明確。", cls: "pattern-burst" },
  up:     { label: "偏多／向上噴出型態", detail: "買call＋賣put 金額最大，傾向偏多方向的部位組合。", cls: "pattern-up" },
  down:   { label: "偏空／向下噴出型態", detail: "買put＋賣call 金額最大，傾向偏空方向的部位組合。", cls: "pattern-down" },
};

function classify(legs) {
  // legs = { bc, sc, bp, sp }（單位：億，皆為正數契約金額）
  const scores = {
    plenum: legs.sc + legs.sp,
    burst:  legs.bc + legs.bp,
    up:     legs.bc + legs.sp,
    down:   legs.bp + legs.sc,
  };
  let best = "plenum";
  Object.keys(scores).forEach(k => { if (scores[k] > scores[best]) best = k; });
  return { key: best, score: scores[best] };
}

function getLegs(latestRows, investorType) {
  const call = latestRows.find(r => r.investor_type === investorType && r.option_type === "call");
  const put  = latestRows.find(r => r.investor_type === investorType && r.option_type === "put");
  if (!call || !put) return null;
  return {
    bc: toYi(call.oi_buy_value_k),
    sc: toYi(call.oi_sell_value_k),
    bp: toYi(put.oi_buy_value_k),
    sp: toYi(put.oi_sell_value_k),
  };
}

function renderSummary(latestRows) {
  const box = document.getElementById("summary");
  const foreignLegs = getLegs(latestRows, "foreign");
  const dealerLegs  = getLegs(latestRows, "dealer");
  if (!foreignLegs || !dealerLegs) { box.style.display = "none"; return; }

  const foreignResult = classify(foreignLegs);
  const dealerResult  = classify(dealerLegs);
  const fp = PATTERNS[foreignResult.key];
  const dp = PATTERNS[dealerResult.key];

  box.innerHTML = `
    <h2>當日部位型態觀察</h2>
    <div class="summary-lines">
      <div><span class="inst-tag">外資</span><span class="${fp.cls}">${fp.label}</span> — ${fp.detail}</div>
      <div><span class="inst-tag">自營商</span><span class="${dp.cls}">${dp.label}</span> — ${dp.detail}</div>
    </div>
  `;
  box.style.display = "block";
}

function buildSeries(allRows, institution, dates) {
  return dates.map(d => {
    const dayRows = allRows.filter(r => r.date === d);
    const legs = getLegs(dayRows, institution);
    return legs || { bc: 0, sc: 0, bp: 0, sp: 0 };
  });
}

function lineChartSvg(series) {
  const width = 400, height = 150;
  const padL = 32, padR = 6, padT = 8, padB = 8;
  const plotW = width - padL - padR, plotH = height - padT - padB;
  const n = series.length;

  const allVals = series.flatMap(s => [s.bc, s.sc, s.bp, s.sp]);
  const maxV = Math.max(...allVals, 1) * 1.15;

  const x = i => padL + (n === 1 ? 0 : (i / (n - 1)) * plotW);
  const y = v => padT + plotH - (v / maxV) * plotH;

  const pathFor = key =>
    series.map((s, i) => (i === 0 ? "M" : "L") + x(i).toFixed(1) + "," + y(s[key]).toFixed(1)).join(" ");

  const gridLines = [0, 0.5, 1].map(f => {
    const yy = padT + plotH * (1 - f);
    return `<line x1="${padL}" y1="${yy}" x2="${width - padR}" y2="${yy}" stroke="var(--divider)" stroke-width="1"/>
            <text x="${padL - 5}" y="${yy + 3}" font-size="8" fill="var(--text-muted)" text-anchor="end">${(maxV * f).toFixed(0)}</text>`;
  }).join("");

  const lineDefs = [
    { key: "bc", color: "var(--long)",  dash: "4,3" },
    { key: "sc", color: "var(--long)",  dash: "" },
    { key: "bp", color: "var(--short)", dash: "4,3" },
    { key: "sp", color: "var(--short)", dash: "" },
  ];
  const lines = lineDefs.map(ld =>
    `<path d="${pathFor(ld.key)}" fill="none" stroke="${ld.color}" stroke-width="2" stroke-dasharray="${ld.dash}"/>`
  ).join("");

  return `<svg viewBox="0 0 ${width} ${height}" style="width:100%; height:150px;">${gridLines}${lines}</svg>`;
}

const CHART_LEGEND = `
  <div class="trend-legend">
    <span class="legend-item"><span class="swatch dash" style="border-color:var(--long)"></span>BC</span>
    <span class="legend-item"><span class="swatch" style="border-color:var(--long)"></span>SC</span>
    <span class="legend-item"><span class="swatch dash" style="border-color:var(--short)"></span>BP</span>
    <span class="legend-item"><span class="swatch" style="border-color:var(--short)"></span>SP</span>
  </div>`;

function trendTableHtml(dates, series) {
  const legKeys = ["bc", "sc", "bp", "sp"];
  const rows = dates.map((d, i) => {
    const s = series[i];
    const cells = legKeys.map(k => `<td>${fmtYi(s[k])}</td>`).join("");
    return `<tr><td>${d.slice(5)}</td>${cells}</tr>`;
  }).join("");
  return `<table class="trend-table">
    <thead><tr><th>日期</th><th>BC</th><th>SC</th><th>BP</th><th>SP</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function renderTrend(allRows) {
  const box = document.getElementById("trend");
  const dates = [...new Set(allRows.map(r => r.date))].sort().slice(-10);
  if (dates.length === 0) { box.style.display = "none"; return; }

  const foreignSeries = buildSeries(allRows, "foreign", dates);
  const dealerSeries  = buildSeries(allRows, "dealer", dates);

  box.innerHTML = `
    <h2>近 10 個交易日部位變化（未平倉契約金額，億元）</h2>
    <div class="trend-grid">
      <div class="trend-inst">
        <h3>外資</h3>
        ${CHART_LEGEND}
        ${lineChartSvg(foreignSeries)}
        ${trendTableHtml(dates, foreignSeries)}
      </div>
      <div class="trend-inst">
        <h3>自營商</h3>
        ${CHART_LEGEND}
        ${lineChartSvg(dealerSeries)}
        ${trendTableHtml(dates, dealerSeries)}
      </div>
    </div>
  `;
  box.style.display = "block";
}

function render(rows) {
  const latestDate = rows.reduce((max, r) => r.date > max ? r.date : max, rows[0].date);
  const latestRows = rows.filter(r => r.date === latestDate);

  document.getElementById("dataDate").textContent = latestDate;
  document.getElementById("lastChecked").textContent =
    "頁面查詢時間：" + new Date().toLocaleString("zh-Hant-TW", { hour12: false });

  renderSummary(latestRows);
  document.getElementById("status").style.display = "none";
}

const STRIKE_CSV_URL = "https://raw.githubusercontent.com/uptronyx-debug/taifex-oi-scraper/main/data/txo_strike_oi.csv";

function daysUntil(expiryYYYYMMDD, latestDateStr) {
  const y = Number(expiryYYYYMMDD.slice(0, 4));
  const m = Number(expiryYYYYMMDD.slice(4, 6)) - 1;
  const d = Number(expiryYYYYMMDD.slice(6, 8));
  const expiryDate = new Date(y, m, d);
  const [ly, lm, ld] = latestDateStr.split("/").map(Number);
  const latest = new Date(ly, lm - 1, ld);
  const diffDays = Math.round((expiryDate - latest) / 86400000);
  const expiryDisplay = `${y}/${String(m + 1).padStart(2, "0")}/${String(d).padStart(2, "0")}`;
  return { diffDays, expiryDisplay };
}

function fmtDelta(d) {
  if (d === undefined || d === null || d === 0) return "";
  return d > 0 ? ` <span class="delta-up">(+${d.toLocaleString()})</span>` : ` <span class="delta-down">(${d.toLocaleString()})</span>`;
}

function renderStrikeSection(rows) {
  const box = document.getElementById("strikeSection");
  if (rows.length === 0) { box.style.display = "none"; return; }

  const dates = [...new Set(rows.map(r => r.date))].sort();
  const latestDate = dates[dates.length - 1];
  const latestRows = rows.filter(r => r.date === latestDate);
  const expiry = latestRows[0].expiry;
  const expiryCode = latestRows[0].expiry_code || expiry;

  // 建立 履約價 -> {call, put} 未平倉量
  const oiMap = {};
  latestRows.forEach(r => {
    const k = r.strike;
    if (!oiMap[k]) oiMap[k] = { call: 0, put: 0 };
    oiMap[k][r.option_type] = Number(r.open_interest) || 0;
  });
  const strikes = Object.keys(oiMap).map(Number).sort((a, b) => a - b);
  if (strikes.length === 0) { box.style.display = "none"; return; }

  // 找出「前一個交易日、且到期合約相同」的資料，用來算新增量
  const prevDate = [...dates].reverse().find(d => {
    if (d >= latestDate) return false;
    const sampleRow = rows.find(r => r.date === d);
    return sampleRow && sampleRow.expiry === expiry;
  });
  let diffMap = null;
  if (prevDate) {
    diffMap = {};
    const prevRows = rows.filter(r => r.date === prevDate);
    const prevOi = {};
    prevRows.forEach(r => {
      const k = r.strike;
      if (!prevOi[k]) prevOi[k] = { call: 0, put: 0 };
      prevOi[k][r.option_type] = Number(r.open_interest) || 0;
    });
    strikes.forEach(k => {
      const curr = oiMap[k];
      const prev = prevOi[k] || { call: 0, put: 0 };
      diffMap[k] = { call: curr.call - prev.call, put: curr.put - prev.put };
    });
  }

  // 最大未平倉履約價
  let maxCallStrike = strikes[0], maxPutStrike = strikes[0];
  strikes.forEach(k => {
    if (oiMap[k].call > oiMap[maxCallStrike].call) maxCallStrike = k;
    if (oiMap[k].put  > oiMap[maxPutStrike].put)   maxPutStrike  = k;
  });

  // 最大新增量履約價
  let maxCallGainStrike = null, maxPutGainStrike = null;
  if (diffMap) {
    strikes.forEach(k => {
      if (maxCallGainStrike === null || diffMap[k].call > diffMap[maxCallGainStrike].call) maxCallGainStrike = k;
      if (maxPutGainStrike  === null || diffMap[k].put  > diffMap[maxPutGainStrike].put)   maxPutGainStrike  = k;
    });
  }

  const maxOi = Math.max(...strikes.map(k => Math.max(oiMap[k].call, oiMap[k].put)), 1);

  const callouts = `
    <div class="strike-callouts">
      <div class="callout">
        <div class="callout-title">最大未平倉 — Call（壓力參考）</div>
        <div class="callout-value call">${maxCallStrike.toLocaleString()}</div>
        <div class="callout-sub">${oiMap[maxCallStrike].call.toLocaleString()} 口</div>
      </div>
      <div class="callout">
        <div class="callout-title">最大未平倉 — Put（支撐參考）</div>
        <div class="callout-value put">${maxPutStrike.toLocaleString()}</div>
        <div class="callout-sub">${oiMap[maxPutStrike].put.toLocaleString()} 口</div>
      </div>
      ${diffMap ? `
      <div class="callout">
        <div class="callout-title">最大新增量 — Call（較 ${prevDate}）</div>
        <div class="callout-value call">${maxCallGainStrike.toLocaleString()}</div>
        <div class="callout-sub">+${diffMap[maxCallGainStrike].call.toLocaleString()} 口</div>
      </div>
      <div class="callout">
        <div class="callout-title">最大新增量 — Put（較 ${prevDate}）</div>
        <div class="callout-value put">${maxPutGainStrike.toLocaleString()}</div>
        <div class="callout-sub">+${diffMap[maxPutGainStrike].put.toLocaleString()} 口</div>
      </div>` : `
      <div class="callout">
        <div class="callout-title">最大新增量</div>
        <div class="callout-sub">合約剛轉倉或缺前一日資料，暫無法比較</div>
      </div>`}
    </div>
  `;

  const rowsHtml = [...strikes].reverse().map(k => {
    const { call, put } = oiMap[k];
    const callPct = (call / maxOi) * 100;
    const putPct = (put / maxOi) * 100;
    const hiCall = k === maxCallStrike ? "hi-call" : "";
    const hiPut  = k === maxPutStrike ? "hi-put" : "";
    const callDelta = diffMap ? fmtDelta(diffMap[k].call) : "";
    const putDelta  = diffMap ? fmtDelta(diffMap[k].put)  : "";
    return `
      <div class="strike-row ${hiCall} ${hiPut}">
        <div class="strike-label-call">${call.toLocaleString()}${callDelta}</div>
        <div class="strike-call-cell"><div class="strike-bar-call" style="width:${callPct}%"></div></div>
        <div class="strike-price">${k.toLocaleString()}</div>
        <div class="strike-put-cell"><div class="strike-bar-put" style="width:${putPct}%"></div></div>
        <div class="strike-label-put">${put.toLocaleString()}${putDelta}</div>
      </div>`;
  }).join("");

  const { diffDays, expiryDisplay } = daysUntil(expiry, latestDate);
  const countdownText = diffDays > 0
    ? `到期日：${expiryDisplay}（倒數 ${diffDays} 天）`
    : diffDays === 0
      ? `到期日：${expiryDisplay}（今天到期）`
      : `到期日：${expiryDisplay}（已過期 ${-diffDays} 天）`;

  box.innerHTML = `
    <h2>履約價未平倉分佈（合約 ${expiryCode}）</h2>
    <div class="strike-sub">資料日期：${latestDate}　｜　${countdownText}　｜　紅：Call　綠：Put　外框標示當日最大量履約價</div>
    ${callouts}
    <div class="strike-axis-labels"><span></span><span class="call-label">Call 未平倉</span><span></span><span class="put-label">Put 未平倉</span><span></span></div>
    <div class="strike-chart">${rowsHtml}</div>
  `;
  box.style.display = "block";
}

fetch(STRIKE_CSV_URL, { cache: "no-store" })
  .then(res => { if (!res.ok) throw new Error("HTTP " + res.status); return res.text(); })
  .then(text => {
    const rows = parseCSV(text);
    renderStrikeSection(rows);
  })
  .catch(() => {
    document.getElementById("strikeSection").style.display = "none";
  });

fetch(CSV_URL, { cache: "no-store" })
  .then(res => {
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.text();
  })
  .then(text => {
    const rows = parseCSV(text);
    if (rows.length === 0) throw new Error("CSV 是空的");
    render(rows);
    renderTrend(rows);
  })
  .catch(err => {
    const status = document.getElementById("status");
    status.textContent = "資料載入失敗：" + err.message + "（請確認 data/txo_oi.csv 是否已經有資料）";
    status.classList.add("error");
  });
</script>
</body>
</html>
