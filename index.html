<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>期權玩家</title>
<meta name="description" content="台指選擇權與期貨三大法人籌碼、外資避險、融資與正2 ETF 期貨部位，盤後自動更新。">
<link rel="canonical" href="https://options.uptronyx.com/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="期權玩家">
<meta property="og:title" content="期權玩家">
<meta property="og:description" content="台指選擇權與期貨三大法人籌碼、外資避險、融資與正2 ETF 期貨部位，盤後自動更新。">
<meta property="og:url" content="https://options.uptronyx.com/">
<meta property="og:image" content="https://options.uptronyx.com/icon-512.png">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=4">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=4">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png?v=4">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=4">
<meta name="theme-color" content="#1C1A17">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;600&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<script>
  try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
  /* 深（預設）：配合 LOGO 的暖黑 */
  :root, :root[data-theme="dark"]{
    --bg:#1C1A17;
    --surface:#262420;
    --surface-2:#2F2C27;
    --divider:#433E35;
    --text:#EFE8D6;
    --text-muted:#BDB4A3;
    --long:#F0614C;      /* 紅：買方 / 多方 / Call */
    --long-soft:#4A2620;
    --short:#3CBF86;     /* 綠：賣方 / 空方 / Put */
    --short-soft:#1D3A2C;
    --gold:#E6B93C;
    --gold-soft:#3D3218;
    --accent-border:#6A6253;
    --margin:#6E9BE0;
    color-scheme:dark;
  }
  /* 淺：配合 LOGO 的米色 */
  :root[data-theme="light"]{
    --bg:#F3EEE3;
    --surface:#FBF8F1;
    --surface-2:#F0E9DA;
    --divider:#DCD2BE;
    --text:#1C1A17;
    --text-muted:#6B6150;
    --long:#C8341F;
    --long-soft:#F7DDD5;
    --short:#1A7F51;
    --short-soft:#DBEEE2;
    --gold:#A57810;
    --gold-soft:#F5E8C6;
    --accent-border:#A89C85;
    --margin:#2F5A93;
    color-scheme:light;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Noto Sans TC', sans-serif;
    line-height:1.6;
    min-height:100vh;
  }
  .wrap{
    max-width:960px;
    margin:0 auto;
    padding:48px 24px 80px;
  }

  /* ---------- Header ---------- */
  header{
    display:flex;
    flex-wrap:wrap;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    padding-bottom:28px;
    border-bottom:1px solid var(--divider);
    margin-bottom:36px;
  }
  h1{
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size:28px;
    margin:0;
    letter-spacing:0.02em;
  }
  .meta{
    color:var(--text-muted);
    font-size:14px;
    text-align:right;
  }
  .meta .date{
    color:var(--text);
    font-family:'Roboto Mono', monospace;
    font-weight:500;
  }

  /* ---------- Status ---------- */
  #status{
    color:var(--text-muted);
    font-size:15px;
    padding:40px 0;
    text-align:center;
  }
  #status.error{color:var(--long);}

  /* ---------- Summary ---------- */
  #summary{
    background:var(--surface);
    border:1px solid var(--divider);
    border-left:3px solid var(--text-muted);
    border-radius:6px;
    padding:14px 16px;
    margin-bottom:16px;
  }
  #summary h2{
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size:14px;
    margin:0 0 8px;
  }
  .lamp-row{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:6px;
  }
  @media (max-width:600px){
    .lamp-row{ grid-template-columns:1fr 1fr; }
  }
  .lamp{
    background:var(--surface-2);
    border:1px solid var(--divider);
    border-radius:6px;
    padding:6px 4px;
    text-align:center;
    opacity:0.5;
    transition:opacity 0.15s;
  }
  .lamp-icon{
    font-size:14px;
    line-height:1;
    margin-bottom:2px;
    color:var(--text-muted);
  }
  .lamp-label{
    font-family:'Roboto Mono', monospace;
    font-size:10px;
    color:var(--text-muted);
  }
  .lamp.lit{ opacity:1; }
  .lamp.lit .lamp-label{ color:var(--text); font-weight:600; }
  .lamp.lit.plenum{ border-color:var(--text-muted); box-shadow:0 0 8px color-mix(in srgb, var(--text-muted) 40%, transparent); }
  .lamp.lit.plenum .lamp-icon{ color:var(--text); }
  .lamp.lit.burst{ border-color:var(--gold); box-shadow:0 0 8px color-mix(in srgb, var(--gold) 45%, transparent); background:var(--gold-soft); }
  .lamp.lit.burst .lamp-icon, .lamp.lit.burst .lamp-label{ color:var(--gold); }
  .lamp.lit.up{ border-color:var(--long); box-shadow:0 0 8px color-mix(in srgb, var(--long) 45%, transparent); background:var(--long-soft); }
  .lamp.lit.up .lamp-icon, .lamp.lit.up .lamp-label{ color:var(--long); }
  .lamp.lit.down{ border-color:var(--short); box-shadow:0 0 8px color-mix(in srgb, var(--short) 45%, transparent); background:var(--short-soft); }
  .lamp.lit.down .lamp-icon, .lamp.lit.down .lamp-label{ color:var(--short); }

  /* ---------- Trend ---------- */
  #trend{
    background:var(--surface);
    border:1px solid var(--divider);
    border-radius:6px;
    padding:22px 24px;
    margin-bottom:24px;
  }
  #trend h2{
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size:17px;
    margin:0 0 8px;
  }
  #trend h3{
    font-family:'Noto Sans TC', sans-serif;
    font-weight:600;
    font-size:14px;
    color:var(--text-muted);
    margin:0 0 8px;
  }
  .trend-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
  }
  @media (max-width:700px){
    .trend-grid{grid-template-columns:1fr;}
  }
  .trend-inst{
    background:var(--surface-2);
    border:1px solid var(--divider);
    border-radius:6px;
    padding:16px;
  }
  .trend-legend{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:8px;
    font-size:11px;
    color:var(--text-muted);
  }
  .legend-item{ display:flex; align-items:center; gap:4px; }
  .swatch{
    display:inline-block;
    width:14px;
    height:0;
    border-top:2px solid;
  }
  .swatch.dash{ border-top-style:dashed; }

  .trend-table{
    width:100%;
    border-collapse:collapse;
    margin-top:8px;
    font-family:'Roboto Mono', monospace;
    font-size:11px;
  }
  .trend-table th, .trend-table td{
    padding:5px 4px;
    text-align:right;
    border-bottom:1px solid var(--divider);
    white-space:nowrap;
  }
  .trend-table th:first-child, .trend-table td:first-child{
    text-align:left;
    font-family:'Noto Sans TC', sans-serif;
    color:var(--text-muted);
  }
  .trend-table th{
    color:var(--text-muted);
    font-weight:500;
    font-size:11px;
  }

  /* ---------- Strike OI ---------- */
  #strikeSection{
    background:var(--surface);
    border:1px solid var(--divider);
    border-radius:6px;
    padding:22px 24px;
    margin-bottom:24px;
  }
  #strikeSection h2{
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size:17px;
    margin:0 0 6px;
  }
  .strike-sub{
    font-size:12px;
    color:var(--text-muted);
    margin-bottom:14px;
  }
  .oi-summary{
    margin-bottom:12px;
  }
  .oi-summary h3{
    font-family:'Noto Sans TC', sans-serif;
    font-weight:600;
    font-size:11px;
    color:var(--text-muted);
    margin:0 0 6px;
  }
  .oi-cards{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  @media (max-width:700px){
    .oi-cards{grid-template-columns:1fr;}
  }
  .oi-card{
    border:1px solid var(--divider);
    border-radius:6px;
    padding:8px 10px;
  }
  .call-card{ background:linear-gradient(160deg, var(--long-soft), var(--surface-2)); }
  .put-card{ background:linear-gradient(160deg, var(--short-soft), var(--surface-2)); }
  .oi-card-title{
    font-family:'Noto Sans TC', sans-serif;
    font-weight:600;
    font-size:11px;
    color:var(--text-muted);
    text-align:center;
    margin-bottom:6px;
  }
  .oi-card-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
    text-align:center;
  }
  .oi-label{
    font-size:9px;
    color:var(--text-muted);
    margin-bottom:3px;
  }
  .oi-pill{
    background:var(--surface-2);
    border:1px solid var(--divider);
    border-radius:5px;
    padding:4px 2px;
    font-family:'Roboto Mono', monospace;
    font-size:13px;
    font-weight:700;
  }
  .oi-pill.call{ color:var(--long); }
  .oi-pill.put{ color:var(--short); }
  .oi-pill-sub{
    font-size:9px;
    color:var(--text-muted);
    margin-top:2px;
  }

  .strike-chart{
    max-height:520px;
    overflow-y:auto;
  }
  .strike-row{
    display:grid;
    grid-template-columns:1fr 64px 1fr;
    align-items:center;
    height:18px;
    margin-bottom:2px;
  }
  .strike-label-call, .strike-label-put{
    font-family:'Roboto Mono', monospace;
    font-size:11px;
    white-space:nowrap;
  }
  .strike-label-call{ color:var(--long); margin-right:5px; }
  .strike-label-put{ color:var(--short); margin-left:5px; }
  .delta-up{ color:var(--long); }
  .delta-down{ color:var(--short); }

  @media (max-width:700px){
    .strike-row{ height:16px; }
    .strike-label-call, .strike-label-put{ font-size:9.5px; }
    .strike-price{ font-size:10px; }
    .oi-pill{ font-size:12px; padding:4px 2px; }
  }
  .strike-row.hi-call .strike-price{ color:var(--long); font-weight:700; }
  .strike-row.hi-put  .strike-price{ color:var(--short); font-weight:700; }
  .strike-call-cell{
    display:flex;
    justify-content:flex-end;
  }
  .strike-put-cell{
    display:flex;
    justify-content:flex-start;
  }
  .strike-bar-call{
    height:12px;
    background:var(--long);
    border-radius:3px 0 0 3px;
    opacity:0.85;
  }
  .strike-row.hi-call .strike-bar-call{ opacity:1; box-shadow:0 0 0 1px var(--long); }
  .strike-bar-put{
    height:12px;
    background:var(--short);
    border-radius:0 3px 3px 0;
    opacity:0.85;
  }
  .strike-row.hi-put .strike-bar-put{ opacity:1; box-shadow:0 0 0 1px var(--short); }
  .strike-price{
    text-align:center;
    font-family:'Roboto Mono', monospace;
    font-variant-numeric:tabular-nums;
    font-size:11px;
    color:var(--text-muted);
  }
  .strike-axis-labels{
    display:grid;
    grid-template-columns:1fr 64px 1fr;
    font-size:10px;
    color:var(--text-muted);
    margin-bottom:6px;
  }
  .strike-axis-labels .call-label{ text-align:right; }
  .strike-axis-labels .put-label{ text-align:left; }


  /* ---------- Tabs ---------- */
  .tabs{
    display:flex; gap:4px; margin:-12px 0 20px;
    border-bottom:1px solid var(--divider);
  }
  .tab{
    background:none; border:none; cursor:pointer;
    color:var(--text-muted); font-family:'Noto Sans TC', sans-serif;
    font-size:15px; font-weight:600; padding:10px 16px;
    border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  .tab:hover{ color:var(--text); }
  .tab.active{ color:var(--text); border-bottom-color:var(--text); }
  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }

  .card{
    background:var(--surface); border:1px solid var(--divider);
    border-radius:6px; padding:22px 24px; margin-bottom:24px;
  }
  .card h2{
    font-family:'Noto Serif TC', serif; font-weight:700;
    font-size:17px; margin:0 0 6px;
  }
  .card .sub{ font-size:12px; color:var(--text-muted); margin-bottom:14px; }
  .stat-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; }
  .stat-grid.three{ grid-template-columns:repeat(3, 1fr); }
  .stat-grid.two{ grid-template-columns:repeat(2, 1fr); }
  @media (max-width:700px){
    .stat-grid, .stat-grid.three{ grid-template-columns:1fr 1fr; }
  }
  .stat{
    background:var(--surface-2); border:1px solid var(--divider);
    border-radius:6px; padding:10px 12px;
  }
  .stat.main{ border-color:var(--accent-border); }
  .stat-label{ font-size:11px; color:var(--text-muted); margin-bottom:2px; }
  .stat-value{
    font-family:'Roboto Mono', monospace; font-weight:700; font-size:20px;
    font-variant-numeric:tabular-nums; line-height:1.3;
  }
  .stat-delta{ font-family:'Roboto Mono', monospace; font-size:11px; color:var(--text-muted); }
  .pos{ color:var(--long); }
  .neg{ color:var(--short); }
  .stat.clickable{ cursor:pointer; transition:border-color .15s; }
  .stat.clickable:hover{ border-color:var(--accent-border); }
  .stat.clickable.selected{ border-color:var(--text-muted); box-shadow:inset 0 0 0 1px var(--text-muted); }
  .table-scroll{ overflow-x:auto; }
  .chart-title{ font-size:12px; color:var(--text-muted); margin:16px 0 4px; }
  .note{ font-size:12px; color:var(--text-muted); padding:12px 0; }


  /* ===== LOGO ===== */
  h1.brand{ margin:0; line-height:0; }
  .logo{ height:48px; width:auto; }
  .logo-light{ display:none; }
  :root[data-theme="light"] .logo-dark{ display:none; }
  :root[data-theme="light"] .logo-light{ display:inline; }
  @media (max-width:700px){ .logo{ height:40px; } }

  /* ===== 介面整理：減少框線、燈號精簡 ===== */
  header{ display:block; padding-bottom:16px; margin-bottom:20px; }
  .head-top{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .meta{ text-align:left; font-size:13px; margin-top:12px; }
  .meta-sep{ margin:0 8px; opacity:.5; }
  .theme-toggle{
    position:relative; display:inline-flex; padding:3px; gap:0; cursor:pointer;
    background:var(--surface-2); border:1px solid var(--divider); border-radius:999px;
    font-family:inherit; font-size:13px;
  }
  .tt-opt{ position:relative; z-index:1; padding:3px 12px; border-radius:999px; color:var(--text-muted); }
  .theme-toggle[data-on="dark"] .tt-opt[data-v="dark"],
  .theme-toggle[data-on="light"] .tt-opt[data-v="light"]{ background:var(--text); color:var(--bg); font-weight:600; }

  .tabs{ margin:0 0 20px; }

  /* 燈號：一行看完 */
  #summary{ border:none; border-radius:8px; padding:12px 18px; margin-bottom:20px; }
  .signal-row{ display:flex; align-items:center; gap:10px 28px; flex-wrap:wrap; }
  .signal-title{ font-size:13px; color:var(--text-muted); font-weight:600; }
  .signal{ display:flex; align-items:center; gap:8px; }
  .signal-who{ font-size:14px; font-weight:600; }
  .settle-grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media (max-width:700px){ .settle-grid{ grid-template-columns:1fr; } }
  .settle-verdict{ display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin:4px 0 14px; }
  .settle-verdict .big{ font-family:'Noto Serif TC', serif; font-size:24px; font-weight:700; }
  .settle-table td.b, .settle-table td.s{ font-weight:700; text-align:center; }
  .settle-table td.b{ color:var(--long); } .settle-table td.s{ color:var(--short); }
  .settle-table td.c{ text-align:center; color:var(--text-muted); }
  .settle-table tr.retail td{ background:var(--surface-2); }
  .lv{ display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--divider); font-size:13px; }
  .lv b{ font-family:'Roboto Mono', monospace; }
  .chip{
    display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px;
    font-family:'Roboto Mono', monospace; font-size:13px; line-height:1.4;
    border:1px solid currentColor;
  }
  .chip b{ font-weight:700; }
  .chip.plenum{ color:var(--text); background:var(--surface-2); }
  .chip.burst{ color:var(--gold); background:var(--gold-soft); }
  .chip.up{ color:var(--long); background:var(--long-soft); }
  .chip.down{ color:var(--short); background:var(--short-soft); }
  @media (max-width:700px){
    .signal-title{ width:100%; }
  }

  /* 外框只留最外層卡片 */
  #trend, #strikeSection, .card{ border:none; border-radius:8px; }
  .trend-inst{ background:none; border:none; border-radius:0; padding:0; }
  @media (min-width:701px){
    .trend-grid > .trend-inst + .trend-inst{ border-left:1px solid var(--divider); padding-left:20px; }
  }
  @media (max-width:700px){
    .trend-grid{ gap:0; }
    .trend-grid > .trend-inst + .trend-inst{ border-top:1px solid var(--divider); padding-top:18px; margin-top:18px; }
  }
  .trend-table th, .trend-table td{ border-bottom:1px solid color-mix(in srgb, var(--divider) 45%, transparent); }
  .trend-table thead th{ border-bottom:1px solid var(--divider); }
  .trend-table tbody tr:last-child td{ border-bottom:none; }
  .stat{ border-color:transparent; }
  .stat.main{ border-color:transparent; }
  .stat.clickable:hover{ border-color:var(--divider); }
  .stat.clickable.selected{ border-color:var(--text-muted); box-shadow:none; }
  .oi-card{ border:none; }
  .oi-pill{ border:none; background:color-mix(in srgb, var(--surface) 70%, transparent); }

  .anchor-row{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; font-size:13px; color:var(--text-muted); margin-bottom:12px; }
  .anchor-row select{ background:var(--surface-2); color:var(--text); border:1px solid var(--divider); border-radius:6px; padding:4px 8px; font-family:inherit; font-size:13px; }
  .anchor-reset{ background:none; border:1px solid var(--divider); color:var(--text-muted); border-radius:6px; padding:3px 10px; font-size:12px; cursor:pointer; font-family:inherit; }
  .range-info{ color:var(--text-muted); margin:-4px 0 12px; }
  .anchor-info{ font-family:'Roboto Mono', monospace; font-size:12px; }
  .sq{ display:inline-block; width:9px; height:9px; border-radius:2px; }
  .warn-row td{ background:var(--gold-soft); }
  .warn-tag{ font-size:10px; color:var(--gold); border:1px solid var(--gold); border-radius:4px; padding:0 4px; margin-left:4px; }
  .tap-hint{ font-size:10px; color:var(--text-muted); border:1px solid var(--divider); border-radius:4px; padding:0 4px; margin-left:4px; white-space:nowrap; }
  .swing-panel{ background:var(--surface-2); border-radius:8px; padding:12px 14px; margin-top:10px; }
  .swing-sum{ display:flex; flex-wrap:wrap; gap:6px 18px; font-size:13px; color:var(--text-muted); margin-bottom:6px; }
  .swing-sum b{ color:var(--text); font-family:'Roboto Mono', monospace; }
  .swing-note{ font-size:11px; color:var(--text-muted); margin-top:8px; }
  .live-row td{ background:color-mix(in srgb, var(--gold) 12%, transparent); }
  .live-tag{ font-size:10px; color:var(--gold); border:1px solid var(--gold); border-radius:4px; padding:0 4px; margin-left:4px; }
  .fld{ display:flex; align-items:center; gap:8px; }
  .range-info{ font-family:'Roboto Mono', monospace; font-size:12px; color:var(--text-muted); margin:-2px 0 12px; }
  .tap-hint{ margin-left:6px; }
  .h2-unit{ font-family:'Noto Sans TC', sans-serif; font-size:12px; font-weight:400; color:var(--text-muted); margin-left:8px; }
  .hedge-head{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .swing-title{ font-size:12px; color:var(--text-muted); margin-bottom:8px; }

<script>
const CSV_URL = "data/txo_oi.csv";

function parseCSV(text) {
  const lines = text.trim().split("\n");
  const headers = lines[0].split(",").map(h => h.trim());
  return lines.slice(1).map(line => {
    const cells = line.split(",");
    const row = {};
    headers.forEach((h, i) => row[h] = (cells[i] || "").trim());
    return row;
  });
}

function toYi(valueK) {
  // 原始單位是千元；1億 = 100,000 千元
  return Number(valueK) / 100000;
}

function fmtYi(n) {
  return n.toLocaleString("zh-Hant", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
}

const PATTERNS = {
  plenum: { label: "盤整", formula: "SC+SP", icon: "↔", cls: "plenum" },
  burst:  { label: "雙向噴出", formula: "BC+BP", icon: "⇅", cls: "burst" },
  up:     { label: "偏多噴出", formula: "BC+SP", icon: "▲", cls: "up" },
  down:   { label: "偏空噴出", formula: "BP+SC", icon: "▼", cls: "down" },
};
const PATTERN_ORDER = ["plenum", "burst", "up", "down"];

function classify(legs) {
  // legs = { bc, sc, bp, sp }（單位：億，皆為正數契約金額）
  const scores = {
    plenum: legs.sc + legs.sp,
    burst:  legs.bc + legs.bp,
    up:     legs.bc + legs.sp,
    down:   legs.bp + legs.sc,
  };
  let best = "plenum";
  Object.keys(scores).forEach(k => { if (scores[k] > scores[best]) best = k; });
  return { key: best, score: scores[best] };
}

function getLegs(latestRows, investorType) {
  const call = latestRows.find(r => r.investor_type === investorType && r.option_type === "call");
  const put  = latestRows.find(r => r.investor_type === investorType && r.option_type === "put");
  if (!call || !put) return null;
  return {
    bc: toYi(call.oi_buy_value_k),
    sc: toYi(call.oi_sell_value_k),
    bp: toYi(put.oi_buy_value_k),
    sp: toYi(put.oi_sell_value_k),
  };
}

function lampRowHtml(litKey) {
  return `<div class="lamp-row">${PATTERN_ORDER.map(key => {
    const p = PATTERNS[key];
    const lit = key === litKey ? "lit" : "";
    return `
      <div class="lamp ${p.cls} ${lit}">
        <div class="lamp-icon">${p.icon}</div>
        <div class="lamp-label">${p.formula}</div>
      </div>`;
  }).join("")}</div>`;
}

function signalHtml(who, key) {
  const p = PATTERNS[key];
  return `<div class="signal"><span class="signal-who">${who}</span>
    <span class="chip ${p.cls}" title="${p.label}">${p.icon}<b>${p.formula}</b></span></div>`;
}
function renderSummary(latestRows) {
  const box = document.getElementById("summary");
  const foreignLegs = getLegs(latestRows, "foreign");
  const dealerLegs  = getLegs(latestRows, "dealer");
  if (!foreignLegs || !dealerLegs) { box.style.display = "none"; return; }
  box.innerHTML = `<div class="signal-row">
      <div class="signal-title">當日部位型態</div>
      ${signalHtml("外資", classify(foreignLegs).key)}
      ${signalHtml("自營商", classify(dealerLegs).key)}
    </div>`;
  box.style.display = "block";
}

function buildSeries(allRows, institution, dates) {
  return dates.map(d => {
    const dayRows = allRows.filter(r => r.date === d);
    const legs = getLegs(dayRows, institution);
    return legs || { bc: 0, sc: 0, bp: 0, sp: 0 };
  });
}

// ================= 圖表查價（滑過／點擊顯示數值） =================
// pts: [{ x, html, marks: [{ y, color }] }]，x / y 為 SVG viewBox 座標
function tipWrap(svg, W, H, pts) {
  const data = encodeURIComponent(JSON.stringify({ W, H, pts }));
  return `<div class="chartbox" data-tip="${data}">${svg}<div class="tip"></div></div>`;
}
function tipShow(box, clientX) {
  const d = box._tip || (box._tip = JSON.parse(decodeURIComponent(box.dataset.tip)));
  const svg = box.querySelector("svg"), tip = box.querySelector(".tip");
  const rect = svg.getBoundingClientRect();
  const vx = (clientX - rect.left) * d.W / rect.width;
  let k = 0, best = Infinity;
  d.pts.forEach((p, i) => { const dd = Math.abs(p.x - vx); if (dd < best) { best = dd; k = i; } });
  const p = d.pts[k];
  let layer = svg.querySelector(".tip-layer");
  if (!layer) { layer = document.createElementNS("http://www.w3.org/2000/svg", "g"); layer.setAttribute("class", "tip-layer"); svg.appendChild(layer); }
  layer.innerHTML = `<line x1="${p.x}" y1="0" x2="${p.x}" y2="${d.H - 16}" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="2,3"/>`
    + (p.marks || []).map(m => `<circle cx="${p.x}" cy="${m.y}" r="4" fill="${m.color}" stroke="var(--surface)" stroke-width="1.5"/>`).join("");
  tip.innerHTML = p.html;
  tip.style.display = "block";
  const px = p.x * rect.width / d.W;
  const tw = tip.offsetWidth, bw = box.clientWidth;
  tip.style.left = Math.max(0, Math.min(bw - tw, px - tw / 2)) + "px";
  box.classList.add("tipping");
}
function tipHide(box) {
  const tip = box.querySelector(".tip"); if (tip) tip.style.display = "none";
  const layer = box.querySelector(".tip-layer"); if (layer) layer.innerHTML = "";
  box.classList.remove("tipping");
}
document.addEventListener("pointermove", e => { const b = e.target.closest && e.target.closest(".chartbox"); if (b && e.pointerType === "mouse") tipShow(b, e.clientX); });
document.addEventListener("pointerdown", e => {
  const b = e.target.closest && e.target.closest(".chartbox");
  document.querySelectorAll(".chartbox.tipping").forEach(x => { if (x !== b) tipHide(x); });
  if (b) tipShow(b, e.clientX);
});
document.addEventListener("pointerout", e => { const b = e.target.closest && e.target.closest(".chartbox"); if (b && e.pointerType === "mouse" && !b.contains(e.relatedTarget)) tipHide(b); });
const tipRow = (label, val, color) => `<div class="tr"><span class="tk"${color ? ` style="color:${color}"` : ""}>${label}</span><b>${val}</b></div>`;

function lineChartSvg(series, labels) {
  const width = 400, height = 166;
  const padL = 26, padR = 10, padT = 8, padB = 22;
  const plotW = width - padL - padR, plotH = height - padT - padB;
  const n = series.length;

  const allVals = series.flatMap(s => [s.bc, s.sc, s.bp, s.sp]);
  const maxV = Math.max(...allVals, 1) * 1.15;

  const x = i => padL + (n === 1 ? 0 : (i / (n - 1)) * plotW);
  const y = v => padT + plotH - (v / maxV) * plotH;

  const pathFor = key =>
    series.map((s, i) => (i === 0 ? "M" : "L") + x(i).toFixed(1) + "," + y(s[key]).toFixed(1)).join(" ");

  const gridLines = [0, 0.5, 1].map(f => {
    const yy = padT + plotH * (1 - f);
    return `<line x1="${padL}" y1="${yy}" x2="${width - padR}" y2="${yy}" stroke="var(--divider)" stroke-width="1"/>
            <text x="${padL - 4}" y="${yy + 3}" font-size="9" fill="var(--text-muted)" text-anchor="end">${(maxV * f).toFixed(0)}</text>`;
  }).join("");

  const lineDefs = [
    { key: "bc", color: "var(--long)",  dash: "4,3" },
    { key: "sc", color: "var(--long)",  dash: "" },
    { key: "bp", color: "var(--short)", dash: "4,3" },
    { key: "sp", color: "var(--short)", dash: "" },
  ];
  const lines = lineDefs.map(ld =>
    `<path d="${pathFor(ld.key)}" fill="none" stroke="${ld.color}" stroke-width="2.2" stroke-dasharray="${ld.dash}"/>`
  ).join("");

  const xl = (labels || []).map((l, i) => {
    const anchor = i === 0 ? "start" : i === n - 1 ? "end" : "middle";
    return (i % 2 === 0 || i === n - 1) && !(i === n - 2)
      ? `<text x="${x(i).toFixed(1)}" y="${height - 6}" font-size="9" fill="var(--text-muted)" text-anchor="${anchor}">${l.slice(5)}</text>` : "";
  }).join("");
  const pts = series.map((s, i) => ({
    x: +x(i).toFixed(1),
    html: `<div class="td">${labels[i]}</div>` + lineDefs.map(ld => tipRow(ld.key.toUpperCase(), s[ld.key].toFixed(1), ld.color)).join(""),
    marks: lineDefs.map(ld => ({ y: +y(s[ld.key]).toFixed(1), color: ld.color })),
  }));
  return tipWrap(`<svg viewBox="0 0 ${width} ${height}" style="width:100%; height:auto; display:block;">${gridLines}${lines}${xl}</svg>`, width, height, pts);
}

const CHART_LEGEND = `
  <div class="trend-legend">
    <span class="legend-item"><span class="swatch dash" style="border-color:var(--long)"></span>BC</span>
    <span class="legend-item"><span class="swatch" style="border-color:var(--long)"></span>SC</span>
    <span class="legend-item"><span class="swatch dash" style="border-color:var(--short)"></span>BP</span>
    <span class="legend-item"><span class="swatch" style="border-color:var(--short)"></span>SP</span>
  </div>`;

function trendTableHtml(dates, series) {
  const legKeys = ["bc", "sc", "bp", "sp"];
  const rows = dates.map((d, i) => {
    const s = series[i];
    const cells = legKeys.map(k => `<td>${fmtYi(s[k])}</td>`).join("");
    return `<tr><td>${d.slice(5)}</td>${cells}</tr>`;
  }).reverse().join("");  // 最新日期在最上面，和期貨、現貨一致
  return `<table class="trend-table">
    <thead><tr><th>日期</th><th>BC</th><th>SC</th><th>BP</th><th>SP</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function renderTrend(allRows) {
  const box = document.getElementById("trend");
  const dates = [...new Set(allRows.map(r => r.date))].sort().slice(-10);
  if (dates.length === 0) { box.style.display = "none"; return; }

  const foreignSeries = buildSeries(allRows, "foreign", dates);
  const dealerSeries  = buildSeries(allRows, "dealer", dates);

  box.innerHTML = `
    <h2>近 10 日部位變化<span class="h2-unit">未平倉金額・億元</span></h2>
    <div class="trend-grid">
      <div class="trend-inst">
        <h3>外資</h3>
        ${CHART_LEGEND}
        ${lineChartSvg(foreignSeries, dates)}
        ${trendTableHtml(dates, foreignSeries)}
      </div>
      <div class="trend-inst">
        <h3>自營商</h3>
        ${CHART_LEGEND}
        ${lineChartSvg(dealerSeries, dates)}
        ${trendTableHtml(dates, dealerSeries)}
      </div>
    </div>
  `;
  box.style.display = "block";
}

function render(rows) {
  const latestDate = rows.reduce((max, r) => r.date > max ? r.date : max, rows[0].date);
  const latestRows = rows.filter(r => r.date === latestDate);

  document.getElementById("dataDate").textContent = latestDate;

  renderSummary(latestRows);
  document.getElementById("status").style.display = "none";
}

const STRIKE_CSV_URL = "data/txo_strike_oi.csv";

function daysUntil(expiryYYYYMMDD, latestDateStr) {
  const y = Number(expiryYYYYMMDD.slice(0, 4));
  const m = Number(expiryYYYYMMDD.slice(4, 6)) - 1;
  const d = Number(expiryYYYYMMDD.slice(6, 8));
  const expiryDate = new Date(y, m, d);
  const [ly, lm, ld] = latestDateStr.split("/").map(Number);
  const latest = new Date(ly, lm - 1, ld);
  const diffDays = Math.round((expiryDate - latest) / 86400000);
  const expiryDisplay = `${y}/${String(m + 1).padStart(2, "0")}/${String(d).padStart(2, "0")}`;
  return { diffDays, expiryDisplay };
}

function fmtDelta(d) {
  if (d === undefined || d === null || d === 0) return "";
  return d > 0 ? ` <span class="delta-up">(+${d.toLocaleString()})</span>` : ` <span class="delta-down">(${d.toLocaleString()})</span>`;
}

function renderStrikeSection(rows) {
  const box = document.getElementById("strikeSection");
  if (rows.length === 0) { box.style.display = "none"; return; }

  const dates = [...new Set(rows.map(r => r.date))].sort();
  const latestDate = dates[dates.length - 1];
  const latestRows = rows.filter(r => r.date === latestDate);
  const expiry = latestRows[0].expiry;
  const expiryCode = latestRows[0].expiry_code || expiry;

  // 建立 履約價 -> {call, put} 未平倉量
  const oiMap = {};
  latestRows.forEach(r => {
    const k = r.strike;
    if (!oiMap[k]) oiMap[k] = { call: 0, put: 0 };
    oiMap[k][r.option_type] = Number(r.open_interest) || 0;
  });
  const strikes = Object.keys(oiMap).map(Number).sort((a, b) => a - b);
  if (strikes.length === 0) { box.style.display = "none"; return; }

  // 找出「前一個交易日、且到期合約相同」的資料，用來算新增量
  const prevDate = [...dates].reverse().find(d => {
    if (d >= latestDate) return false;
    const sampleRow = rows.find(r => r.date === d);
    return sampleRow && sampleRow.expiry === expiry;
  });
  let diffMap = null;
  if (prevDate) {
    diffMap = {};
    const prevRows = rows.filter(r => r.date === prevDate);
    const prevOi = {};
    prevRows.forEach(r => {
      const k = r.strike;
      if (!prevOi[k]) prevOi[k] = { call: 0, put: 0 };
      prevOi[k][r.option_type] = Number(r.open_interest) || 0;
    });
    strikes.forEach(k => {
      const curr = oiMap[k];
      const prev = prevOi[k] || { call: 0, put: 0 };
      diffMap[k] = { call: curr.call - prev.call, put: curr.put - prev.put };
    });
  }

  // 最大未平倉履約價
  let maxCallStrike = strikes[0], maxPutStrike = strikes[0];
  strikes.forEach(k => {
    if (oiMap[k].call > oiMap[maxCallStrike].call) maxCallStrike = k;
    if (oiMap[k].put  > oiMap[maxPutStrike].put)   maxPutStrike  = k;
  });

  // 最大新增量履約價
  let maxCallGainStrike = null, maxPutGainStrike = null;
  if (diffMap) {
    strikes.forEach(k => {
      if (maxCallGainStrike === null || diffMap[k].call > diffMap[maxCallGainStrike].call) maxCallGainStrike = k;
      if (maxPutGainStrike  === null || diffMap[k].put  > diffMap[maxPutGainStrike].put)   maxPutGainStrike  = k;
    });
  }

  const maxCallOi = Math.max(...strikes.map(k => oiMap[k].call), 1);
  const maxPutOi  = Math.max(...strikes.map(k => oiMap[k].put), 1);

  const callouts = `
    <div class="oi-summary">
      <h3>選擇權最大未平倉</h3>
      <div class="oi-cards">
        <div class="oi-card call-card">
          <div class="oi-card-title">買權 Call</div>
          <div class="oi-card-row">
            <div class="oi-col">
              <div class="oi-label">最大未平倉</div>
              <div class="oi-pill call">${maxCallStrike.toLocaleString()}</div>
              <div class="oi-pill-sub">${oiMap[maxCallStrike].call.toLocaleString()} 口</div>
            </div>
            <div class="oi-col">
              <div class="oi-label">增量最大</div>
              ${diffMap ? `
              <div class="oi-pill call">${maxCallGainStrike.toLocaleString()}</div>
              <div class="oi-pill-sub">+${diffMap[maxCallGainStrike].call.toLocaleString()} 口</div>
              ` : `<div class="oi-pill-sub">暫無法比較</div>`}
            </div>
          </div>
        </div>
        <div class="oi-card put-card">
          <div class="oi-card-title">賣權 Put</div>
          <div class="oi-card-row">
            <div class="oi-col">
              <div class="oi-label">最大未平倉</div>
              <div class="oi-pill put">${maxPutStrike.toLocaleString()}</div>
              <div class="oi-pill-sub">${oiMap[maxPutStrike].put.toLocaleString()} 口</div>
            </div>
            <div class="oi-col">
              <div class="oi-label">增量最大</div>
              ${diffMap ? `
              <div class="oi-pill put">${maxPutGainStrike.toLocaleString()}</div>
              <div class="oi-pill-sub">+${diffMap[maxPutGainStrike].put.toLocaleString()} 口</div>
              ` : `<div class="oi-pill-sub">暫無法比較</div>`}
            </div>
          </div>
        </div>
      </div>
    </div>
  `;

  const visibleStrikes = strikes.filter(k => oiMap[k].call >= 1000 || oiMap[k].put >= 1000);

  const rowsHtml = visibleStrikes.map(k => {
    const { call, put } = oiMap[k];
    const callPct = (Math.sqrt(call) / Math.sqrt(maxCallOi)) * 100;
    const putPct = (Math.sqrt(put) / Math.sqrt(maxPutOi)) * 100;
    const hiCall = k === maxCallStrike ? "hi-call" : "";
    const hiPut  = k === maxPutStrike ? "hi-put" : "";
    const callDelta = diffMap ? fmtDelta(diffMap[k].call) : "";
    const putDelta  = diffMap ? fmtDelta(diffMap[k].put)  : "";
    const callLabel = call >= 1000 ? `<span class="strike-label-call">${call.toLocaleString()}${callDelta}</span>` : "";
    const putLabel  = put  >= 1000 ? `<span class="strike-label-put">${put.toLocaleString()}${putDelta}</span>`  : "";
    return `
      <div class="strike-row ${hiCall} ${hiPut}">
        <div class="strike-call-cell">${callLabel}<div class="strike-bar-call" style="width:${callPct}%"></div></div>
        <div class="strike-price">${k.toLocaleString()}</div>
        <div class="strike-put-cell"><div class="strike-bar-put" style="width:${putPct}%"></div>${putLabel}</div>
      </div>`;
  }).join("");

  const { diffDays, expiryDisplay } = daysUntil(expiry, latestDate);
  const countdownText = diffDays > 0
    ? `到期日：${expiryDisplay}（倒數 ${diffDays} 天）`
    : diffDays === 0
      ? `到期日：${expiryDisplay}（今天到期）`
      : `到期日：${expiryDisplay}（已過期 ${-diffDays} 天）`;

  box.innerHTML = `
    <h2>履約價未平倉分佈（合約 ${expiryCode}）</h2>
    <div class="strike-sub">資料日期：${latestDate}　｜　${countdownText}　｜　紅：Call　綠：Put　外框標示當日最大量履約價　｜　數字僅標示≥1,000口</div>
    ${callouts}
    <div class="strike-axis-labels"><span class="call-label">Call 未平倉</span><span></span><span class="put-label">Put 未平倉</span></div>
    <div class="strike-chart">${rowsHtml || '<div style="color:var(--text-muted); font-size:12px; padding:12px 0;">目前沒有履約價未平倉量達 1,000 口以上</div>'}</div>
  `;
  box.style.display = "block";
}

// ================= 共用小工具 =================
const RAW = "data/";
const signCls = v => v > 0 ? "pos" : v < 0 ? "neg" : "";
const fmtInt = v => (v > 0 ? "+" : "") + Math.round(v).toLocaleString();
const fmtYi2 = v => (v > 0 ? "+" : "") + v.toLocaleString("zh-Hant", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function statHtml(label, value, valueText, deltaText, main) {
  return `<div class="stat ${main ? "main" : ""}">
    <div class="stat-label">${label}</div>
    <div class="stat-value ${signCls(value)}">${valueText}</div>
    ${deltaText ? `<div class="stat-delta">${deltaText}</div>` : ""}
  </div>`;
}

// 跨年度時 X 軸顯示「年/月」，否則「月/日」
const xLab = (l, labels) => labels[0].slice(0, 4) !== labels[labels.length - 1].slice(0, 4) ? l.slice(2, 7) : l.slice(5);
const chartW = () => Math.max(300, Math.min(900, document.querySelector(".wrap").clientWidth - 60));

// 正負值的長條圖（紅正綠負），labels 為日期
function barChartSvg(values, labels, fmt) {
  fmt = fmt || (v => fmtYi2(v));
  const width = chartW(), height = chartW() < 500 ? 140 : 170, padL = 46, padR = 6, padT = 8, padB = 18;
  const plotW = width - padL - padR, plotH = height - padT - padB;
  const maxAbs = Math.max(...values.map(v => Math.abs(v)), 1) * 1.1;
  const y0 = padT + plotH / 2;
  const scale = (plotH / 2) / maxAbs;
  const bw = plotW / values.length;
  const bars = values.map((v, i) => {
    const h = Math.abs(v) * scale;
    const x = padL + i * bw + bw * 0.15;
    const yy = v >= 0 ? y0 - h : y0;
    return `<rect x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${(bw * 0.7).toFixed(1)}" height="${Math.max(h, 0.5).toFixed(1)}" fill="${v >= 0 ? "var(--long)" : "var(--short)"}"/>`;
  }).join("");
  const step = Math.ceil(values.length / Math.max(3, Math.floor(width / 75)));
  const showLbl = (i, n) => i === n - 1 || (i % step === 0 && n - 1 - i >= step * 0.75);
  const xl = labels.map((l, i) => showLbl(i, labels.length)
    ? `<text x="${(i === labels.length - 1 ? width - padR : padL + i * bw + bw / 2).toFixed(1)}" y="${height - 4}" font-size="10" fill="var(--text-muted)" text-anchor="${i === labels.length - 1 ? "end" : "middle"}">${xLab(l, labels)}</text>` : "").join("");
  const grid = [maxAbs, 0, -maxAbs].map(v => {
    const yy = y0 - v * scale;
    return `<line x1="${padL}" y1="${yy}" x2="${width - padR}" y2="${yy}" stroke="var(--divider)" stroke-width="${v === 0 ? 1.2 : 1}"/>
      <text x="${padL - 5}" y="${yy + 3}" font-size="10" fill="var(--text-muted)" text-anchor="end">${Math.round(v).toLocaleString()}</text>`;
  }).join("");
  const pts = values.map((v, i) => ({
    x: +(padL + i * bw + bw / 2).toFixed(1),
    html: `<div class="td">${labels[i]}</div><b class="${signCls(v)}">${fmt(v)}</b>`,
    marks: [],
  }));
  return tipWrap(`<svg viewBox="0 0 ${width} ${height}" style="width:100%; height:auto; display:block;">${grid}${bars}${xl}</svg>`, width, height, pts);
}

// 淨部位折線（可為負值），含 0 軸
function netLineSvg(values, labels, fmt, fixedColor, fmtAxis) {
  fmt = fmt || (v => Math.round(v).toLocaleString());
  fmtAxis = fmtAxis || (v => Math.abs(v) >= 100 ? Math.round(v).toLocaleString() : v.toFixed(Math.abs(v) >= 10 ? 1 : 2));
  const width = chartW(), height = chartW() < 500 ? 140 : 170, padL = 54, padR = 10, padT = 8, padB = 18;
  const plotW = width - padL - padR, plotH = height - padT - padB;
  let lo = Math.min(...values), hi = Math.max(...values);
  const pad = (hi - lo) * 0.1 || Math.abs(hi) * 0.05 || 1; lo -= pad; hi += pad;
  const n = values.length;
  const x = i => padL + (n === 1 ? plotW / 2 : (i / (n - 1)) * plotW);
  const y = v => padT + (hi - v) / (hi - lo) * plotH;
  const path = values.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + "," + y(v).toFixed(1)).join(" ");
  const last = values[n - 1];
  const color = fixedColor || (last >= 0 ? "var(--long)" : "var(--short)");
  const grid = [hi, (hi + lo) / 2, lo].map(v =>
    `<line x1="${padL}" y1="${y(v)}" x2="${width - padR}" y2="${y(v)}" stroke="var(--divider)" stroke-width="1"/>
     <text x="${padL - 5}" y="${y(v) + 3}" font-size="10" fill="var(--text-muted)" text-anchor="end">${fmtAxis(v)}</text>`).join("");
  const zero = (lo < 0 && hi > 0) ? `<line x1="${padL}" y1="${y(0)}" x2="${width - padR}" y2="${y(0)}" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="3,3"/>` : "";
  const step = Math.ceil(n / Math.max(3, Math.floor(width / 75)));
  const xl = labels.map((l, i) => i === n - 1 || (i % step === 0 && n - 1 - i >= step * 0.75)
    ? `<text x="${x(i).toFixed(1)}" y="${height - 4}" font-size="10" fill="var(--text-muted)" text-anchor="${i === n - 1 && n > 1 ? "end" : i === 0 ? "start" : "middle"}">${xLab(l, labels)}</text>` : "").join("");
  const dots = values.map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.2" fill="${color}"/>`).join("");
  const pts = values.map((v, i) => ({ x: +x(i).toFixed(1), html: `<div class="td">${labels[i]}</div><b>${fmt(v)}</b>`, marks: [{ y: +y(v).toFixed(1), color }] }));
  return tipWrap(`<svg viewBox="0 0 ${width} ${height}" style="width:100%; height:auto; display:block;">${grid}${zero}<path d="${path}" fill="none" stroke="${color}" stroke-width="2"/>${dots}${xl}</svg>`, width, height, pts);
}


// ================= 結算前籌碼研判（週二看週三、週四看週五） =================
// 規則：結算前一日，外資、自營商各自 Call / Put 的「淨金額變化」與「淨口數變化」
//   金額↑ 口數↑ → 價內、價外都買（不知道價內外時假設都買）
//   金額↓ 口數↓ → 價內、價外都賣
//   金額↓ 口數↑ → 賣價內（貴）、買價外（便宜）
//   金額↑ 口數↓ → 買價內、賣價外
// 兩法人同方向的格子 → 散戶站對面；散戶偏空（賣 Call／買 Put）→ 結算傾向拉高，偏多 → 傾向壓低
const SETTLE_MIN_OI = 1500;   // 當週合約只看未平倉 ≥ 1500 口的履約價
const SETTLE_MIN_AGREE = 3;   // 兩法人同方向 ≥3 格才給方向
let OPT_ROWS = null, STRIKE_ROWS = null;
const ymd = e => `${e.slice(0, 4)}/${e.slice(4, 6)}/${e.slice(6, 8)}`;
const WD = d => "日一二三四五六"[new Date(d.replace(/\//g, "-") + "T00:00:00").getDay()];

function settleRead(d, p) {
  const get = (dd, t, inv) => OPT_ROWS.find(r => r.date === dd && r.option_type === t && r.investor_type === inv);
  const out = {};
  for (const inv of ["foreign", "dealer"]) for (const t of ["call", "put"]) {
    const a = get(d, t, inv), b = get(p, t, inv);
    if (!a || !b) return null;
    const dv = Number(a.oi_net_value_k) - Number(b.oi_net_value_k), dl = Number(a.oi_net_volume) - Number(b.oi_net_volume);
    const [itm, otm] = dv >= 0 && dl >= 0 ? ["B", "B"] : dv < 0 && dl < 0 ? ["S", "S"] : dv < 0 ? ["S", "B"] : ["B", "S"];
    out[inv + t] = { nv: Number(a.oi_net_value_k), nl: Number(a.oi_net_volume), dv, dl, itm, otm };
  }
  const cells = [];
  let vote = 0;
  for (const t of ["call", "put"]) for (const m of ["itm", "otm"]) {
    const f = out["foreign" + t][m], dd = out["dealer" + t][m];
    let retail = null;
    if (f === dd) { retail = f === "B" ? "S" : "B"; vote += ((t === "call") === (retail === "S")) ? 1 : -1; }
    cells.push({ t, m, f, d: dd, retail });
  }
  const agree = cells.filter(c => c.retail).length;
  const lean = vote > 0 ? "拉高" : vote < 0 ? "壓低" : "觀望";
  // 回測（2025/12 起約 90 次結算）：法人同向 ≥3 格才有優勢，其餘視為觀望
  return { out, cells, agree, lean, verdict: agree >= SETTLE_MIN_AGREE ? lean : "觀望" };
}

function renderSettle() {
  const box = document.getElementById("settleBox");
  if (!OPT_ROWS || !STRIKE_ROWS) return;
  const dates = [...new Set(OPT_ROWS.map(r => r.date))].sort();
  const exps = [...new Set(STRIKE_ROWS.map(r => r.expiry))].sort();
  const tx = taiexMap();
  // 每個結算日的前一交易日 → 研判；有收盤就對答案
  const hist = [];
  for (const e of exps) {
    const ed = ymd(e), i = dates.indexOf(ed);
    if (i < 2) continue;
    const r = settleRead(dates[i - 1], dates[i - 2]);
    if (!r) continue;
    const a = tx[dates[i - 1]], b = tx[ed];
    hist.push({ e, ed, d: dates[i - 1], ...r, chg: a && b ? b - a : null });
  }
  // 今天（最新資料日）的下一個結算日
  const last = dates[dates.length - 1];
  const nextE = exps.find(e => ymd(e) > last);
  const isEve = nextE && ["二", "四"].includes(WD(last)) && (new Date(ymd(nextE)) - new Date(last)) / 864e5 <= 1;
  let cur = isEve ? { e: nextE, ed: ymd(nextE), d: last, ...settleRead(last, dates[dates.length - 2]) } : null;
  if (!cur || !cur.cells) cur = hist[hist.length - 1];
  if (!cur) { box.innerHTML = ""; return; }

  const BS = x => x === "B" ? `<td class="b">Buy</td>` : x === "S" ? `<td class="s">Sell</td>` : `<td class="c">—</td>`;
  const yi = v => (v / 1e5).toFixed(2), sg = v => (Number(String(v).replace(/,/g, "")) > 0 ? "+" : "") + v;
  const inv = [["foreign", "外資"], ["dealer", "自營商"]];
  const chipTable = `<div class="table-scroll"><table class="trend-table settle-table">
    <tr><th></th><th></th><th>淨部位</th><th>前一日變化</th><th>推論</th></tr>
    ${inv.map(([k, n]) => ["call", "put"].map((t, j) => { const o = cur.out[k + t]; return `<tr>
      ${j === 0 ? `<td rowspan="2"><b>${n}</b></td>` : ""}<td>${t === "call" ? "Call" : "Put"}</td>
      <td class="num">${yi(o.nv)} 億<br>${o.nl.toLocaleString()} 口</td>
      <td class="num"><span class="${signCls(o.dv)}">${sg(yi(o.dv))} 億</span><br><span class="${signCls(o.dl)}">${sg(o.dl.toLocaleString())} 口</span></td>
      <td>價內 ${o.itm === "B" ? "Buy" : "Sell"}・價外 ${o.otm === "B" ? "Buy" : "Sell"}</td></tr>`; }).join("")).join("")}
  </table></div>`;
  const cell = (t, m) => cur.cells.find(c => c.t === t && c.m === m);
  const order = [["call", "itm", "價內 Call"], ["call", "otm", "價外 Call"], ["put", "itm", "價內 Put"], ["put", "otm", "價外 Put"]];
  const quad = `<div class="table-scroll"><table class="trend-table settle-table">
    <tr><th></th>${order.map(o => `<th>${o[2]}</th>`).join("")}</tr>
    <tr><td>外資</td>${order.map(o => BS(cell(o[0], o[1]).f)).join("")}</tr>
    <tr><td>自營商</td>${order.map(o => BS(cell(o[0], o[1]).d)).join("")}</tr>
    <tr class="retail"><td><b>散戶</b></td>${order.map(o => BS(cell(o[0], o[1]).retail)).join("")}</tr>
  </table></div>`;
  const conf = cur.agree >= SETTLE_MIN_AGREE ? "足夠" : "不足";

  // 當週合約 OI 大量區（≥1500 口）＋防守區間
  const sd = [...new Set(STRIKE_ROWS.filter(r => r.expiry === cur.e).map(r => r.date))].sort();
  const sAt = dd => { const m = {}; STRIKE_ROWS.filter(r => r.expiry === cur.e && r.date === dd).forEach(r => { m[r.option_type + r.strike] = Number(r.open_interest); }); return m; };
  const sdD = sd.includes(cur.d) ? cur.d : sd[sd.length - 1], sdP = sd[sd.indexOf(sdD) - 1];
  const now = sAt(sdD), prev = sdP ? sAt(sdP) : {};
  const big = t => Object.entries(now).filter(([k, v]) => k.startsWith(t) && v >= SETTLE_MIN_OI)
    .map(([k, v]) => ({ k: Number(k.slice(t.length)), v, dv: v - (prev[k] || 0) })).sort((a, b) => b.k - a.k);
  const calls = big("call"), puts = big("put");
  const fut = (TXM_ROWS || []).filter(r => r.date === cur.d).sort((a, b) => a.contract < b.contract ? -1 : 1)[0];
  const spot = tx[cur.d], ref = spot || (fut && Number(fut.settle));
  const basis = fut && spot ? Math.round(Number(fut.settle) - spot) : 0;
  const up = calls.filter(c => c.k >= ref).sort((a, b) => a.k - b.k)[0], dn = puts.filter(c => c.k <= ref)[0];
  let defense = "";
  if (up && dn) {
    const w = up.k - dn.k, f = Math.round(w * 130 / 500);
    const tgt = cur.verdict === "拉高" ? up.k : cur.verdict === "壓低" ? dn.k : (up.k + dn.k) / 2;
    defense = `<div class="lv"><span><b style="font-family:inherit">推估結算點位</b>（${cur.verdict === "拉高" ? "上方 Call 大量區" : cur.verdict === "壓低" ? "下方 Put 大量區" : "區間中點"}）</span><b>${Math.round(tgt + basis).toLocaleString()}</b></div>
      <div class="lv"><span>推估區間（多方防線～空方防線）</span><b>${(dn.k + basis - f).toLocaleString()} – ${(up.k + basis + f).toLocaleString()}</b></div>
      <div class="lv"><span>防守區間</span><b>${(dn.k + basis).toLocaleString()} – ${(up.k + basis).toLocaleString()}（${w.toLocaleString()} 點）</b></div>
      <div class="lv"><span>防守力道（區間 × 130/500）</span><b>${f} 點</b></div>
      <div class="lv"><span>空方防線</span><b class="pos">${(up.k + basis + f).toLocaleString()}</b></div>
      <div class="lv"><span>多方防線</span><b class="neg">${(dn.k + basis - f).toLocaleString()}</b></div>`;
  }
  const lvRow = (c, t) => `<div class="lv"><span>${t} ${c.k.toLocaleString()}${basis ? `（期 ${(c.k + basis).toLocaleString()}）` : ""}</span><b>${c.v.toLocaleString()} 口 <span class="${signCls(c.dv)}">${sg(c.dv.toLocaleString())}</span></b></div>`;
  const levels = `<div><div class="chart-title" style="margin-top:0">當週 OI 大量區（≥${SETTLE_MIN_OI.toLocaleString()} 口）</div>
    ${calls.map(c => lvRow(c, "Call")).join("") || `<div class="note">Call 無</div>`}
    <div class="lv"><span>${spot ? "加權指數收盤" : "近月期貨"}</span><b>${Math.round(ref || 0).toLocaleString()}${basis ? `（期現價差 ${sg(Math.round(basis))}）` : ""}</b></div>
    ${puts.map(c => lvRow(c, "Put")).join("") || `<div class="note">Put 無</div>`}</div>`;

  // 回測
  const done = hist.filter(h => h.chg !== null);
  const dir = done.filter(h => h.verdict !== "觀望"), hit = dir.filter(h => (h.chg > 0) === (h.verdict === "拉高")).length;
  const btRows = done.slice(-20).reverse().map(h => {
    const ok = h.verdict === "觀望" ? "—" : (h.chg > 0) === (h.verdict === "拉高") ? `<span class="pos">✓</span>` : `<span class="neg">✗</span>`;
    return `<tr><td>${h.ed.slice(2)}（${WD(h.ed)}）</td><td>${h.verdict}${h.verdict === "觀望" && h.lean !== "觀望" ? `<span class="note" style="padding:0">（${h.lean}）</span>` : ""}</td><td>${h.agree}/4</td><td class="num ${signCls(h.chg)}">${sg(Math.round(h.chg).toLocaleString())}</td><td>${ok}</td></tr>`;
  }).join("");

  box.innerHTML = `<div class="card">
    <h2>結算前籌碼研判</h2>

// ================= 時段按鈕（各區塊獨立，預設 1 個月，不記憶） =================
// 以「月」為單位，從最新一天往回推（5年＝最新日往前 60 個月）
const PERIODS = [[1, "1個月"], [6, "半年"], [12, "1年"], [60, "5年"]];
const PERIOD = { fut: 1, etf: 1, hedge: 1, hold: 1 };
const cutoffOf = (last, m) => { const d = new Date(last.replace(/\//g, "-") + "T00:00:00Z"); d.setUTCMonth(d.getUTCMonth() - m); return d.toISOString().slice(0, 10).replace(/-/g, "/"); };
const inPeriod = (arr, k, key = x => x) => { if (!arr.length) return arr; const c = cutoffOf(key(arr[arr.length - 1]), PERIOD[k]); return arr.filter(x => key(x) > c); };
// 資料起點比所選時段晚 10 天以上＝歷史不足
const isShort = (labels, k) => labels.length > 0 && (new Date(labels[0].replace(/\//g, "-")) - new Date(cutoffOf(labels[labels.length - 1], PERIOD[k]).replace(/\//g, "-"))) / 864e5 > 10;
function setPeriod(k, n) {
  PERIOD[k] = n;
  if (k === "fut" && FUT_ROWS) renderFutures(FUT_ROWS);
  else if (k === "etf" && ETF_ROWS) renderEtfFut();
  else if (k === "hedge" || k === "hold") renderHedge();
}
const periodSeg = k => `<div class="seg">${PERIODS.map(([n, l]) => `<button class="${PERIOD[k] === n ? "on" : ""}" onclick="setPeriod('${k}',${n})">${l}</button>`).join("")}</div>`;
// 圖表標題＋時段按鈕；資料不足所選時段時註明起始日
const periodHead = (title, k, labels) => {
  const short = isShort(labels, k);
  return `<div class="hedge-head" style="margin:16px 0 4px"><div class="chart-title" style="margin:0">${title}・${short ? `${labels[0]} 起（資料只到這裡）` : `近 ${labels.length} 日`}</div>${periodSeg(k)}</div>`;
};
// 加權指數收盤：taiex.csv（長期歷史）＋ margin.csv（每日更新）
function taiexMap() {
  const tx = {};
  (TAIEX_ROWS || []).forEach(r => { tx[r.date] = Number(r.taiex); });
  (MARGIN_ROWS || []).forEach(r => { if (Number(r.taiex)) tx[r.date] = Number(r.taiex); });
  return tx;
}

// 每天的「近月、次月」：排除當天已結算（結算價為 0）的合約，取最近兩個月份
function monthPairs(txmRows) {
  const byDate = {};
  (txmRows || []).forEach(r => {
    if (Number(r.settle) <= 0) return;
    (byDate[r.date] = byDate[r.date] || []).push({ contract: r.contract, oi: Number(r.oi) });
  });
  Object.values(byDate).forEach(list => list.sort((a, b) => a.contract < b.contract ? -1 : 1));
  return byDate;
}
const fmtMonth = c => c ? `${c.slice(0, 4)}/${c.slice(4)}` : "";

function renderFutures(rows) {
