// ================= 融資 =================
// 起算日：預設「近 60 個交易日加權收盤最高點」，可手動指定
let MARGIN_ANCHOR = null;
try { MARGIN_ANCHOR = localStorage.getItem("marginAnchor") || null; } catch (e) {}
function setMarginAnchor(v) {
  MARGIN_ANCHOR = v || null;
  try { v ? localStorage.setItem("marginAnchor", v) : localStorage.removeItem("marginAnchor"); } catch (e) {}
  renderMargin();
}
let SHOW_SWINGS = false;
function toggleSwings() { SHOW_SWINGS = !SHOW_SWINGS; renderMargin(); }
// 找出歷次「高點回落 ≥ th、之後反彈 ≥ th」的波段（zigzag）
function findSwings(rows, th) {
  const pts = []; let mode = "up", hi = 0, lo = 0;
  for (let k = 1; k < rows.length; k++) {
    if (mode === "up") {
      if (rows[k].taiex > rows[hi].taiex) hi = k;
      else if (rows[k].taiex <= rows[hi].taiex * (1 - th)) { pts.push(["H", hi]); mode = "down"; lo = k; }
    } else {
      if (rows[k].taiex < rows[lo].taiex) lo = k;
      else if (rows[k].taiex >= rows[lo].taiex * (1 + th)) { pts.push(["L", lo]); mode = "up"; hi = k; }
    }
  }
  const out = [];
  for (let i = 0; i < pts.length; i++) {
    if (pts[i][0] !== "H") continue;
    const H = rows[pts[i][1]];
    const done = i + 1 < pts.length;
    const L = done ? rows[pts[i + 1][1]] : rows[rows.length - 1];
    const di = L.taiex / H.taiex - 1, da = L.amt / H.amt - 1, dl = L.lots / H.lots - 1;
    out.push({ H, L, done, days: rows.indexOf(L) - rows.indexOf(H), di, da, dl, ratio: di < 0 ? da / di : null });
  }
  return out;
}
let MARGIN_END = null;   // 結算日：預設最新一天，不記憶（新資料進來時自動跟上）
function setMarginEnd(v) { MARGIN_END = v || null; renderMargin(); }
const pct = v => (v > 0 ? "+" : "") + (v * 100).toFixed(2) + "%";

// 每日對照：兩組長條（指數漲跌%、融資金額增減%），警訊日（指數跌、融資增）加底色
function pairBarSvg(idx, mg, labels, warn) {
  const width = chartW(), height = chartW() < 500 ? 150 : 180, padL = 42, padR = 6, padT = 8, padB = 18;
  const plotW = width - padL - padR, plotH = height - padT - padB;
  const maxAbs = Math.max(...idx.map(Math.abs), ...mg.map(Math.abs), 0.001) * 1.15;
  const y0 = padT + plotH / 2, sc = (plotH / 2) / maxAbs, bw = plotW / idx.length;
  const bar = (v, x, w, fill) => {
    const h = Math.abs(v) * sc;
    return `<rect x="${x.toFixed(1)}" y="${(v >= 0 ? y0 - h : y0).toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(h, 0.5).toFixed(1)}" fill="${fill}"/>`;
  };
  const body = idx.map((v, i) => {
    const x = padL + i * bw, w = bw * 0.34;
    const bg = warn[i]
      ? `<rect x="${(x + bw * 0.06).toFixed(1)}" y="${padT}" width="${(bw * 0.88).toFixed(1)}" height="${plotH}" fill="var(--gold)" opacity="0.16"/>
         <text x="${(x + bw / 2).toFixed(1)}" y="${padT + 11}" font-size="11" fill="var(--gold)" text-anchor="middle">▲</text>` : "";
    const hit = `<rect x="${x.toFixed(1)}" y="${padT}" width="${bw.toFixed(1)}" height="${plotH}" fill="transparent"/>`;
    return `<g>${bg}${hit}`
      + bar(v, x + bw * 0.14, w, "var(--text-muted)") + bar(mg[i], x + bw * 0.52, w, "var(--margin)") + `</g>`;
  }).join("");
  const step = Math.ceil(idx.length / Math.max(3, Math.floor(width / 75)));
  const xl = labels.map((l, i) => (i === labels.length - 1 || (i % step === 0 && labels.length - 1 - i >= step * 0.75))
    ? `<text x="${(padL + i * bw + bw / 2).toFixed(1)}" y="${height - 4}" font-size="10" fill="var(--text-muted)" text-anchor="middle">${l.slice(5)}</text>` : "").join("");
  const grid = [maxAbs, 0, -maxAbs].map(v => {
    const yy = y0 - v * sc;
    return `<line x1="${padL}" y1="${yy}" x2="${width - padR}" y2="${yy}" stroke="var(--divider)" stroke-width="${v === 0 ? 1.2 : 1}"/>
      <text x="${padL - 5}" y="${yy + 3}" font-size="10" fill="var(--text-muted)" text-anchor="end">${(v * 100).toFixed(1)}%</text>`;
  }).join("");
  const pts = idx.map((v, i) => ({
    x: +(padL + i * bw + bw / 2).toFixed(1),
    html: `<div class="td">${labels[i]}</div>` + tipRow("指數", pct(v)) + tipRow("融資", pct(mg[i]), "var(--margin)") + (warn[i] ? `<div class="tw">指數跌、融資增</div>` : ""),
    marks: [],
  }));
  return tipWrap(`<svg viewBox="0 0 ${width} ${height}" style="width:100%; height:auto; display:block;">${grid}${body}${xl}</svg>`, width, height, pts);
}

// 自起算日的累計變化（%），多條線
function multiLineSvg(seriesList, labels, fmt) {
  // fmt 未給：數值為比例，軸與提示顯示 %，並含 0 軸；給了 fmt：一般數值，不強制含 0，null 值斷開
  const isPct = !fmt;
  fmt = fmt || pct;
  const width = chartW(), height = chartW() < 500 ? 160 : 190, padL = isPct ? 46 : 54, padR = 10, padT = 10, padB = 18;
  const plotW = width - padL - padR, plotH = height - padT - padB;
  const all = seriesList.flatMap(s => s.values).filter(v => v !== null && v !== undefined);
  let lo = isPct ? Math.min(...all, 0) : Math.min(...all), hi = isPct ? Math.max(...all, 0) : Math.max(...all);
  const pad = (hi - lo) * 0.08 || Math.abs(hi) * 0.05 || 0.01; lo -= pad; hi += pad;
  const n = labels.length;
  const x = i => padL + (n === 1 ? plotW / 2 : (i / (n - 1)) * plotW);
  const y = v => padT + (hi - v) / (hi - lo) * plotH;
  const axis = v => isPct ? (v * 100).toFixed(1) + "%" : Math.round(v).toLocaleString();
  const grid = [hi, (hi + lo) / 2, lo].map(v =>
    `<line x1="${padL}" y1="${y(v)}" x2="${width - padR}" y2="${y(v)}" stroke="var(--divider)"/>
     <text x="${padL - 5}" y="${y(v) + 3}" font-size="10" fill="var(--text-muted)" text-anchor="end">${axis(v)}</text>`).join("");
  const zero = isPct ? `<line x1="${padL}" y1="${y(0)}" x2="${width - padR}" y2="${y(0)}" stroke="var(--text-muted)" stroke-dasharray="3,3"/>` : "";
  const ok = v => v !== null && v !== undefined;
  const pathOf = vals => { let d = "", pen = false; vals.forEach((v, i) => { if (!ok(v)) { pen = false; return; } d += (pen ? "L" : "M") + x(i).toFixed(1) + "," + y(v).toFixed(1) + " "; pen = true; }); return d; };
  const dots = s => s.values.map((v, i) => ok(v) && !ok(s.values[i - 1]) && !ok(s.values[i + 1]) ? `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.5" fill="${s.color}"/>` : "").join("");
  const lines = seriesList.map(s => `<path d="${pathOf(s.values)}" fill="none" stroke="${s.color}" stroke-width="2.2" ${s.dash ? 'stroke-dasharray="5,4"' : ""}/>${dots(s)}`).join("");
  const step = Math.ceil(n / Math.max(3, Math.floor(width / 75)));
  const xl = labels.map((l, i) => (i === n - 1 || (i % step === 0 && n - 1 - i >= step * 0.75))
    ? `<text x="${x(i).toFixed(1)}" y="${height - 4}" font-size="10" fill="var(--text-muted)" text-anchor="${i === n - 1 && n > 1 ? "end" : i === 0 ? "start" : "middle"}">${xLab(l, labels)}</text>` : "").join("");
  const pts = labels.map((l, i) => ({
    x: +x(i).toFixed(1),
    html: `<div class="td">${l}</div>` + seriesList.map(s => tipRow(s.name || "", ok(s.values[i]) ? fmt(s.values[i]) : "—", s.color)).join(""),
    marks: seriesList.filter(s => ok(s.values[i])).map(s => ({ y: +y(s.values[i]).toFixed(1), color: s.color })),
  }));
  return tipWrap(`<svg viewBox="0 0 ${width} ${height}" style="width:100%; height:auto; display:block;">${grid}${zero}${lines}${xl}</svg>`, width, height, pts);
}

function swingPanel(rows) {
  const latestYear = rows[rows.length - 1].date.slice(0, 4);
  const sw = findSwings(rows, 0.05);
  const done = sw.filter(x => x.done && x.ratio !== null);
  const rs = done.map(x => x.ratio).sort((a, b) => a - b);
  const med = rs.length ? (rs.length % 2 ? rs[(rs.length - 1) / 2] : (rs[rs.length / 2 - 1] + rs[rs.length / 2]) / 2) : null;
  const over1 = rs.filter(r => r >= 1).length;
  const tr = sw.slice().reverse().map(x => `<tr${x.done ? "" : ' class="live-row"'}>
      <td>${x.H.date.startsWith(latestYear) ? "" : x.H.date.slice(2, 4) + "/"}${x.H.date.slice(5)}→${x.L.date.slice(5)}${x.done ? "" : ' <span class="live-tag">進行中</span>'}</td>
      <td class="hide-m">${x.days}</td><td class="${signCls(x.di)}">${pct(x.di)}</td><td class="${signCls(x.da)}">${pct(x.da)}</td>
      <td class="${signCls(x.dl)}">${pct(x.dl)}</td>
      <td style="font-weight:700;color:${x.ratio === null ? "inherit" : x.ratio >= 1 ? "var(--short)" : "var(--text)"}">${x.ratio === null ? "—" : x.ratio.toFixed(2)}</td></tr>`).join("");
  return `<div class="swing-panel">
    <div class="swing-title">歷次回檔（跌 ≥5% 後反彈 ≥5%）</div>
    <div class="swing-sum">
      <div><b>${done.length}</b><span>次數</span></div>
      <div><b>${med === null ? "—" : med.toFixed(2)}</b><span>低點中位數</span></div>
      <div><b>${rs.length ? rs[0].toFixed(2) + "–" + rs[rs.length - 1].toFixed(2) : "—"}</b><span>範圍</span></div>
      <div><b>${over1}</b><span>≥1 倍</span></div>
    </div>
    <div class="table-scroll"><table class="trend-table">
      <thead><tr><th>高點→低點</th><th class="hide-m">天數</th><th>指數</th><th>金額</th><th>張數</th><th>倍數</th></tr></thead>
      <tbody>${tr}</tbody>
    </table></div>
    <div class="swing-note">即時計算。進行中的那波算到最新一天；要從低點漲回 5% 才確認反轉。</div>
  </div>`;
}

function renderMargin() {
  const box = document.getElementById("marginBox");
  const rows = (MARGIN_ROWS || []).map(r => ({
    date: r.date, taiex: Number(r.taiex), lots: Number(r.margin_lots), amt: Number(r.margin_amount_k) / 100000,
  })).filter(r => r.taiex > 0 && r.amt > 0).sort((a, b) => a.date < b.date ? -1 : 1);
  if (rows.length < 2) { box.innerHTML = `<div class="note">融資資料累積中</div>`; return; }
  const latest = rows[rows.length - 1];
  // 結算日（預設最新）
  let endRow = latest, endManual = false;
  if (MARGIN_END) {
    const e = rows.find(r => r.date === MARGIN_END);
    if (e && e !== rows[0]) { endRow = e; endManual = e !== latest; }
  }
  const EI = rows.indexOf(endRow);
  const upto = rows.slice(0, EI + 1);
  const last = endRow;

  // 起算日：預設為結算日往前 60 個交易日內的最高收盤
  const win = upto.slice(-60);
  let auto = win.reduce((m, r) => r.taiex > m.taiex ? r : m, win[0]);
  if (auto === last && upto.length > 1) auto = upto.slice(-60, -1).reduce((m, r) => r.taiex > m.taiex ? r : m, upto.slice(-60, -1)[0]);
  let anchor = auto, manual = false;
  if (MARGIN_ANCHOR) {
    const m = rows.find(r => r.date === MARGIN_ANCHOR);
    if (m && m.date < last.date) { anchor = m; manual = true; }
  }
  const ai = rows.indexOf(anchor);
  const since = rows.slice(ai, EI + 1);
  const idxChg = last.taiex / anchor.taiex - 1;
  const amtChg = last.amt / anchor.amt - 1;
  const lotChg = last.lots / anchor.lots - 1;
  const ratio = idxChg < 0 ? amtChg / idxChg : null;

  const verdict = ratio === null
    ? `<div class="stat clickable ${SHOW_SWINGS ? "selected" : ""}" onclick="toggleSwings()"><div class="stat-label">減幅 ÷ 跌幅<span class="tap-hint">歷次 ${SHOW_SWINGS ? "▴" : "▾"}</span></div><div class="stat-value">—</div></div>`
    : `<div class="stat clickable ${SHOW_SWINGS ? "selected" : ""}" onclick="toggleSwings()" style="background:${ratio >= 1 ? "var(--short-soft)" : "var(--long-soft)"}">
         <div class="stat-label">減幅 ÷ 跌幅<span class="tap-hint">歷次 ${SHOW_SWINGS ? "▴" : "▾"}</span></div>
         <div class="stat-value" style="color:${ratio >= 1 ? "var(--short)" : "var(--long)"}">${ratio.toFixed(2)} 倍</div>
         </div>`;
  const stats = `<div class="stat-grid">
    ${statHtml("加權指數", idxChg, pct(idxChg), `${Math.round(anchor.taiex).toLocaleString()} → ${Math.round(last.taiex).toLocaleString()}`, false)}
    ${statHtml("融資金額", amtChg, pct(amtChg), `${anchor.amt.toFixed(0)} → ${last.amt.toFixed(0)} 億`, false)}
    ${statHtml("融資張數", lotChg, pct(lotChg), "", false)}
    ${verdict}
  </div>`;

  // 起算日選單（近 120 個交易日）
  const opts = upto.slice(0, -1).reverse().map(r =>
    `<option value="${r.date}" ${manual && r.date === anchor.date ? "selected" : ""}>${r.date}（${r.taiex.toLocaleString()}）</option>`).join("");
  const endOpts = rows.slice(1, -1).reverse().map(r =>
    `<option value="${r.date}" ${endManual && r.date === last.date ? "selected" : ""}>${r.date}（${r.taiex.toLocaleString()}）</option>`).join("");
  const picker = `<div class="anchor-row">
    <label class="fld"><span>起算日</span>
      <select onchange="setMarginAnchor(this.value)">
        <option value="" ${manual ? "" : "selected"}>自動 ${auto.date.slice(5)}</option>${opts}
      </select></label>
    <label class="fld"><span>結算日</span>
      <select onchange="setMarginEnd(this.value)">
        <option value="" ${endManual ? "" : "selected"}>最新 ${latest.date.slice(5)}</option>${endOpts}
      </select></label>
    ${manual || endManual ? `<button class="anchor-reset" onclick="MARGIN_END=null; setMarginAnchor('')">重設</button>` : ""}
  </div>
  <div class="range-info">${anchor.date.slice(5)} ${Math.round(anchor.taiex).toLocaleString()} → ${last.date.slice(5)} ${Math.round(last.taiex).toLocaleString()}・${since.length - 1} 個交易日</div>`;

  const lineChart = multiLineSvg([
    { name: "指數", values: since.map(r => r.taiex / anchor.taiex - 1), color: "var(--text-muted)" },
    { name: "融資金額", values: since.map(r => r.amt / anchor.amt - 1), color: "var(--margin)" },
    { name: "融資張數", values: since.map(r => r.lots / anchor.lots - 1), color: "var(--margin)", dash: true },
  ], since.map(r => r.date));

  // 每日對照（近 30 日）
  const daily = upto.slice(-31).map((r, i, a) => i === 0 ? null : {
    date: r.date, idx: r.taiex / a[i - 1].taiex - 1, amt: r.amt / a[i - 1].amt - 1,
    amtDiff: r.amt - a[i - 1].amt, lotDiff: r.lots - a[i - 1].lots,
  }).filter(Boolean);
  const warn = daily.map(d => d.idx < 0 && d.amt > 0);
  const warnCount = warn.slice(-5).filter(Boolean).length;

  const tableRows = upto.slice(-11).map((r, i, a) => {
    if (i === 0) return "";
    const p = a[i - 1];
    const di = r.taiex / p.taiex - 1, da = r.amt - p.amt, dl = r.lots - p.lots;
    const w = di < 0 && da > 0;
    const fromIdx = r.date >= anchor.date ? pct(r.taiex / anchor.taiex - 1) : "—";
    const fromAmt = r.date >= anchor.date ? pct(r.amt / anchor.amt - 1) : "—";
    return `<tr${w ? ' class="warn-row"' : ""}><td>${r.date.slice(5)}${w ? ' <span class="warn-tag">接刀</span>' : ""}</td>
      <td class="hide-m">${r.taiex.toLocaleString()}</td><td class="${signCls(di)}">${pct(di)}</td>
      <td class="hide-m">${r.amt.toFixed(1)}</td><td class="${signCls(da)}">${(da > 0 ? "+" : "") + da.toFixed(1)}</td>
      <td class="${signCls(dl)}">${fmtInt(dl)}</td><td class="hide-m">${fromIdx}</td><td class="hide-m">${fromAmt}</td></tr>`;
  }).reverse().join("");

  box.innerHTML = `<div class="card">
    <h2>融資 vs 大盤</h2>
    <div class="sub">資料日期 ${latest.date}・集中市場・倍數 ≥ 1 代表融資退得比指數多</div>
    ${picker}
    ${stats}
    ${SHOW_SWINGS ? swingPanel(rows) : ""}
    <div class="chart-title">區間累計變化（以起算日為 0）</div>
    <div class="trend-legend">
      <span class="legend-item"><span class="swatch" style="border-color:var(--text-muted)"></span>加權指數</span>
      <span class="legend-item"><span class="swatch" style="border-color:var(--margin)"></span>融資金額</span>
      <span class="legend-item"><span class="swatch dash" style="border-color:var(--margin)"></span>融資張數</span>
    </div>
    ${lineChart}
    <div class="chart-title chart-title-row"><span>每日對照（%）・近 ${daily.length} 日</span><span>近 5 日指數跌融資增 <b style="color:${warnCount ? "var(--gold)" : "var(--text-muted)"}">${warnCount} 天</b></span></div>
    <div class="trend-legend">
      <span class="legend-item"><span class="sq" style="background:var(--text-muted)"></span>指數</span>
      <span class="legend-item"><span class="sq" style="background:var(--margin)"></span>融資金額</span>
      <span class="legend-item"><span style="color:var(--gold)">▲</span>&nbsp;指數跌、融資增</span>
    </div>
    ${pairBarSvg(daily.map(d => d.idx), daily.map(d => d.amt), daily.map(d => d.date), warn)}
    <div class="table-scroll"><table class="trend-table">
      <thead><tr><th>日期</th><th class="hide-m">加權</th><th>漲跌</th><th class="hide-m">融資(億)</th><th>增減(億)</th><th>張數增減</th><th class="hide-m">指數自起算</th><th class="hide-m">融資自起算</th></tr></thead>
      <tbody>${tableRows}</tbody>
    </table></div>
  </div>`;
}

// ================= 個股融資排行 =================
let MTOP_DATE = null, MTOP_VIEW = "day", MTOP_SCOPE = "all";
try { MTOP_SCOPE = localStorage.getItem("mtopScope") || "all"; } catch (e) {}
function setMtopDate(v) { MTOP_DATE = v || null; renderMarginTop(); }
function setMtopView(v) { MTOP_VIEW = v; renderMarginTop(); }
function setMtopScope(v) { MTOP_SCOPE = v; try { localStorage.setItem("mtopScope", v); } catch (e) {} renderMarginTop(); }
function renderMarginTop() {
  const box = document.getElementById("marginTopBox");
  const rowsAll = (MTOP_ROWS || []).filter(r => r.change_amount !== undefined && r.scope);
  if (!rowsAll.length) { box.innerHTML = ""; return; }
  const rows = rowsAll.filter(r => r.scope === MTOP_SCOPE);
  const dates = [...new Set(rows.map(r => r.date))].sort();
  const d = MTOP_DATE && dates.includes(MTOP_DATE) ? MTOP_DATE : dates[dates.length - 1];
  const yiS = v => (v > 0 ? "+" : "") + (Number(v) / 1e8).toFixed(2);
  const lots = v => (v > 0 ? "+" : "") + Number(v).toLocaleString();
  // 當日全市場融資金額增減
  const mrows = (MARGIN_ROWS || []).slice().sort((x, y) => x.date < y.date ? -1 : 1);
  const mi = mrows.findIndex(r => r.date === d);
  const dayTotal = mi > 0 ? (Number(mrows[mi].margin_amount_k) - Number(mrows[mi - 1].margin_amount_k)) / 1e5 : null;
  let body;
  if (MTOP_VIEW === "day") {
    const list = side => rows.filter(r => r.date === d && r.side === side).sort((a, b) => a.rank - b.rank).map(r =>
      `<tr><td class="rk">${r.rank}</td><td class="nm">${r.name}<span class="cd">${r.code}</span></td>
        <td class="${side === "inc" ? "pos" : "neg"}">${yiS(r.change_amount)}</td><td class="hide-m">${lots(r.change_lots)}</td></tr>`).join("");
    const tbl = (title, side) => `<div class="top-col"><div class="top-title ${side === "inc" ? "pos" : "neg"}">${title}</div>
      <table class="trend-table top-table"><thead><tr><th></th><th>個股</th><th>金額(億)</th><th class="hide-m">張數</th></tr></thead><tbody>${list(side)}</tbody></table></div>`;
    const etfIn = rowsAll.filter(r => r.date === d && r.scope === "all" && r.code.startsWith("00"));
    const etfNote = MTOP_SCOPE === "all"
      ? (etfIn.length ? `<span class="etf-note">含 ETF：${etfIn.map(r => r.name).join("、")}</span>` : `<span class="etf-note">當日前 5 名沒有 ETF，與「只看個股」相同</span>`)
      : (etfIn.length ? `<span class="etf-note">已排除：${etfIn.map(r => r.name).join("、")}</span>` : `<span class="etf-note">當日前 5 名沒有 ETF，與「含 ETF」相同</span>`);
    body = `<div class="day-total">${dayTotal === null ? "" : `當日全市場融資 <b class="${signCls(dayTotal)}">${(dayTotal > 0 ? "+" : "") + dayTotal.toFixed(1)} 億</b>`}${etfNote}</div>
      <div class="top-grid">${tbl("資增前 5", "inc")}${tbl("資減前 5", "dec")}</div>`;
  } else {
    const win = dates.filter(x => x <= d).slice(-30);
    const agg = side => {
      const m = {};
      rows.filter(r => r.side === side && win.includes(r.date)).forEach(r => {
        const k = r.code;
        m[k] = m[k] || { code: r.code, name: r.name, n: 0, sum: 0, last: r.date };
        m[k].n += 1; m[k].sum += Number(r.change_amount); if (r.date > m[k].last) m[k].last = r.date;
      });
      return Object.values(m).sort((a, b) => b.n - a.n || Math.abs(b.sum) - Math.abs(a.sum)).slice(0, 10);
    };
    const tbl = (title, side) => `<div class="top-col"><div class="top-title ${side === "inc" ? "pos" : "neg"}">${title}</div>
      <table class="trend-table top-table"><thead><tr><th>個股</th><th>次數</th><th>累計(億)</th><th class="hide-m">最近</th></tr></thead><tbody>
      ${agg(side).map(x => `<tr><td class="nm">${x.name}<span class="cd">${x.code}</span></td><td>${x.n}</td>
        <td class="${side === "inc" ? "pos" : "neg"}">${yiS(x.sum)}</td><td class="hide-m">${x.last.slice(5)}</td></tr>`).join("")}</tbody></table></div>`;
    body = `<div class="sub" style="margin:0 0 8px">${win[0]} ～ ${win[win.length - 1]}，${win.length} 個交易日的上榜次數與累計金額</div>
      <div class="top-grid">${tbl("資增上榜", "inc")}${tbl("資減上榜", "dec")}</div>`;
  }
  const opts = dates.slice().reverse().map(x => `<option value="${x}" ${x === d ? "selected" : ""}>${x}</option>`).join("");
  box.innerHTML = `<div class="card">
    <h2>個股融資排行</h2>
    <div class="sub">集中市場・依融資增減金額排序（張數增減 × 收盤價）</div>
    <div class="anchor-row top-ctrl">
      <label class="fld"><span>日期</span><select onchange="setMtopDate(this.value)">${opts}</select></label>
      <div class="seg">
        <button class="${MTOP_VIEW === "day" ? "on" : ""}" onclick="setMtopView('day')">當日</button>
        <button class="${MTOP_VIEW === "freq" ? "on" : ""}" onclick="setMtopView('freq')">近 30 日</button>
      </div>
      <div class="seg">
        <button class="${MTOP_SCOPE === "all" ? "on" : ""}" onclick="setMtopScope('all')">含 ETF</button>
        <button class="${MTOP_SCOPE === "stock" ? "on" : ""}" onclick="setMtopScope('stock')">只看個股</button>
      </div>
    </div>
    ${body}
  </div>`;
}


// 兩條線各用自己的比例尺（無 Y 軸），用提示框看數值
function dualLineSvg(a, b, labels, fmtA, fmtB, colorA, colorB, nameA, nameB, extra, axisA, axisB) {
  axisA = axisA || fmtA; axisB = axisB || fmtB;
  const rng = vals => { let lo = Math.min(...vals), hi = Math.max(...vals); const pd = (hi - lo) * 0.08 || 1; return [lo - pd, hi + pd]; };
  const [aLo, aHi] = rng(a), [bLo, bHi] = rng(b);
  const tw = (f, lo, hi) => Math.max(...[lo, hi, (lo + hi) / 2].map(v => String(f(v)).length)) * 6.2 + 8;
  const width = chartW(), height = chartW() < 500 ? 170 : 210, padT = 10, padB = 18;
  const padL = Math.max(42, tw(axisA, aLo, aHi)), padR = Math.max(46, tw(axisB, bLo, bHi));
  const plotW = width - padL - padR, plotH = height - padT - padB, n = labels.length;
  const x = i => padL + (n === 1 ? plotW / 2 : (i / (n - 1)) * plotW);
  const ya = v => padT + (aHi - v) / (aHi - aLo) * plotH, yb = v => padT + (bHi - v) / (bHi - bLo) * plotH;
  const path = (vals, y) => vals.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + "," + y(v).toFixed(1)).join(" ");
  const grid = [0, 0.5, 1].map(f => `<line x1="${padL}" y1="${padT + plotH * f}" x2="${width - padR}" y2="${padT + plotH * f}" stroke="var(--divider)"/>
    <text x="${padL - 5}" y="${padT + plotH * f + 3}" font-size="10" fill="${colorA}" text-anchor="end">${axisA(aHi - (aHi - aLo) * f)}</text>
    <text x="${width - padR + 5}" y="${padT + plotH * f + 3}" font-size="10" fill="${colorB}" text-anchor="start">${axisB(bHi - (bHi - bLo) * f)}</text>`).join("");
  const step = Math.ceil(n / Math.max(3, Math.floor(width / 75)));
  const xl = labels.map((l, i) => (i === n - 1 || (i % step === 0 && n - 1 - i >= step * 0.75))
    ? `<text x="${x(i).toFixed(1)}" y="${height - 4}" font-size="10" fill="var(--text-muted)" text-anchor="${i === n - 1 ? "end" : i === 0 ? "start" : "middle"}">${xLab(l, labels)}</text>` : "").join("");
  const pts = labels.map((l, i) => ({ x: +x(i).toFixed(1),
    html: `<div class="td">${l}</div>` + tipRow(nameA, fmtA(a[i]), colorA) + tipRow(nameB, fmtB(b[i]), colorB) + (extra ? extra(i) : ""),
    marks: [{ y: +ya(a[i]).toFixed(1), color: colorA }, { y: +yb(b[i]).toFixed(1), color: colorB }] }));
  return tipWrap(`<svg viewBox="0 0 ${width} ${height}" style="width:100%; height:auto; display:block;">${grid}
    <path d="${path(b, yb)}" fill="none" stroke="${colorB}" stroke-width="1.8"/>
    <path d="${path(a, ya)}" fill="none" stroke="${colorA}" stroke-width="2.2"/>${xl}</svg>`, width, height, pts);
}

function hedgePanel(data) {
  const tx = taiexMap();
  const all = data.filter(r => tx[r.date]);
  if (all.length < 30) return `<div class="swing-panel"><div class="swing-note">資料不足</div></div>`;
  const per = inPeriod(all, "hedge", r => r.date);
  const hs = per.map(r => r.hedge), sorted = hs.slice().sort((x, y) => x - y);
  const q = f => sorted[Math.min(sorted.length - 1, Math.floor(f * (sorted.length - 1)))];
  const cur = hs[hs.length - 1];
  const rank = sorted.filter(v => v <= cur).length / sorted.length;
  const pp = v => (v * 100).toFixed(2) + "%";

  // 相關係數：避險比例 vs 指數
  const corr = (A, B) => { const n = A.length, ma = A.reduce((s, v) => s + v, 0) / n, mb = B.reduce((s, v) => s + v, 0) / n;
    let sab = 0, saa = 0, sbb = 0; for (let i = 0; i < n; i++) { sab += (A[i] - ma) * (B[i] - mb); saa += (A[i] - ma) ** 2; sbb += (B[i] - mb) ** 2; }
    return sab / Math.sqrt(saa * sbb); };
  const idxArr = per.map(r => tx[r.date]);
  const c = corr(hs, idxArr);

  // 依避險比例分五組，看之後 5 日、20 日指數報酬
  const pos = {}; all.forEach((r, i) => { pos[r.date] = i; });
  const fwd = (r, k) => { const i = pos[r.date]; return i + k < all.length ? tx[all[i + k].date] / tx[r.date] - 1 : null; };
  const cuts = [q(0.2), q(0.4), q(0.6), q(0.8)];
  const groups = [[], [], [], [], []];
  per.forEach(r => { let g = cuts.findIndex(cv => r.hedge <= cv); if (g < 0) g = 4; groups[g].push(r); });
  const avg = arr => { const v = arr.filter(x => x !== null); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };
  const names = ["最低 20%", "偏低", "中間", "偏高", "最高 20%"];
  const curG = (() => { let g = cuts.findIndex(cv => cur <= cv); return g < 0 ? 4 : g; })();
  const gtr = groups.map((g, i) => {
    const f5 = avg(g.map(r => fwd(r, 5))), f20 = avg(g.map(r => fwd(r, 20)));
    const lo = g.length ? Math.min(...g.map(r => r.hedge)) : 0, hi = g.length ? Math.max(...g.map(r => r.hedge)) : 0;
    const cell = v => v === null ? "—" : `<span class="${signCls(v)}">${pct(v)}</span>`;
    return `<tr${i === curG ? ' class="live-row"' : ""}><td>${names[i]}${i === curG ? ' <span class="live-tag">目前</span>' : ""}</td>
      <td>${pp(lo)}–${pp(hi)}</td><td class="hide-m">${g.length}</td><td>${cell(f5)}</td><td>${cell(f20)}</td></tr>`;
  }).join("");

  return `<div class="swing-panel">
    <div class="hedge-head">
      <div class="swing-title" style="margin:0">避險比例歷史統計</div>
      ${periodSeg("hedge")}
    </div>
    <div class="swing-sum">
      <div><b>${pp(cur)}</b><span>目前（第 ${Math.round(rank * 100)} 百分位）</span></div>
      <div><b>${pp(q(0.5))}</b><span>中位數</span></div>
      <div><b>${pp(sorted[0])}–${pp(sorted[sorted.length - 1])}</b><span>範圍</span></div>
      <div><b class="${c >= 0 ? "pos" : "neg"}">${c.toFixed(2)}</b><span>與指數相關係數</span></div>
    </div>
    <div class="trend-legend">
      <span class="legend-item"><span class="swatch" style="border-color:var(--gold)"></span>避險比例</span>
      <span class="legend-item"><span class="swatch" style="border-color:var(--text-muted)"></span>加權指數</span>
    </div>
    ${dualLineSvg(hs.map(v => v * 100), idxArr, per.map(r => r.date), v => v.toFixed(2) + "%", v => Math.round(v).toLocaleString(), "var(--gold)", "var(--text-muted)", "避險比例", "加權指數")}
    <div class="chart-title">依避險比例高低分五組：之後的加權指數平均報酬</div>
    <div class="table-scroll"><table class="trend-table">
      <thead><tr><th>避險比例</th><th>區間</th><th class="hide-m">天數</th><th>之後 5 日</th><th>之後 20 日</th></tr></thead>
      <tbody>${gtr}</tbody></table></div>
    <div class="swing-note">${per[0].date} 起共 ${per.length} 個交易日${isShort(per.map(r => r.date), "hedge") ? "（歷史資料只到這裡）" : ""}。相關係數接近 −1 代表指數越低、避險比例越高；分組報酬只是過去統計，最近的日子還沒有「之後 20 日」資料。</div>
  </div>`;
}

// ================= 外資持股與期貨避險比例 =================
function renderHedge() {
  const box = document.getElementById("hedgeBox");
  if (!HOLD_ROWS || !HOLD_ROWS.length || !FUT_ROWS) { box.innerHTML = ""; return; }
  const futNet = {};
  FUT_ROWS.forEach(r => {
    if (r.investor_type !== "foreign" || r.product !== "TX") return;
    futNet[r.date] = (futNet[r.date] || 0) + Number(r.oi_net_value_k) * 1000;
  });
  const data = HOLD_ROWS.filter(r => futNet[r.date] !== undefined).map(r => {
    const fv = Number(r.foreign_value), mv = Number(r.market_value), fn = futNet[r.date];
    return { date: r.date, fv, mv, own: fv / mv, fn, hedge: -fn / fv };
  }).sort((a, b) => a.date < b.date ? -1 : 1);
  if (!data.length) { box.innerHTML = ""; return; }
  const t = data[data.length - 1], p = data[data.length - 2];
  const zhao = v => (v / 1e12).toFixed(2);
  const yi = v => Math.round(v / 1e8).toLocaleString();
  const pp = v => (v * 100).toFixed(2) + "%";
  const dpp = (a, b) => b ? `較前日 ${((a - b) * 100 >= 0 ? "+" : "")}${((a - b) * 100).toFixed(2)} 個百分點` : "";
  const stats = `<div class="stat-grid">
    ${statHtml("外資持股市值（兆）", 0, zhao(t.fv), p ? `較前日 ${t.fv >= p.fv ? "+" : ""}${((t.fv / p.fv - 1) * 100).toFixed(2)}%` : "", false)}
    ${statHtml("外資持股比率", 0, pp(t.own), dpp(t.own, p && p.own), false)}
    ${statHtml("外資大台淨部位（億）", t.fn, (t.fn > 0 ? "+" : "") + yi(t.fn), "", false)}
    ${statHtml("避險比例", 0, pp(t.hedge), dpp(t.hedge, p && p.hedge), true)}
  </div>
  ${hedgePanel(data)}`;
  const hold = HOLD_ROWS.map(r => ({ date: r.date, fv: Number(r.foreign_value), own: Number(r.foreign_value) / Number(r.market_value) }))
    .filter(r => r.fv > 0 && r.own > 0).sort((a, b) => a.date < b.date ? -1 : 1);
  const holdP = inPeriod(hold, "hold", r => r.date);
  const holdChart = holdP.length >= 2 ? `${periodHead("外資持股市值與持股比率", "hold", holdP.map(r => r.date))}
    <div class="trend-legend">
      <span class="legend-item"><span class="swatch" style="border-color:var(--margin)"></span>持股市值（兆，左軸）</span>
      <span class="legend-item"><span class="swatch" style="border-color:#B07CD8"></span>持股比率（右軸）</span>
    </div>
    ${dualLineSvg(holdP.map(r => r.fv / 1e12), holdP.map(r => r.own * 100), holdP.map(r => r.date), v => v.toFixed(2) + " 兆", v => v.toFixed(2) + "%", "var(--margin)", "#B07CD8", "持股市值", "持股比率", null, v => v.toFixed(1), v => v.toFixed(1) + "%")}` : "";
  const tr = data.slice(-20).reverse().map(r => `<tr><td>${r.date.slice(5)}</td><td>${zhao(r.fv)}</td><td class="hide-m">${pp(r.own)}</td>
    <td class="${signCls(r.fn)}">${(r.fn > 0 ? "+" : "") + yi(r.fn)}</td><td>${pp(r.hedge)}</td></tr>`).join("");
  box.innerHTML = `<div class="card">
    <h2>外資持股與期貨避險</h2>
    <div class="sub">資料日期 ${t.date}・避險比例＝大台淨空單現值 ÷ 外資持股市值（集中市場普通股）</div>
    ${stats}
    ${holdChart}
    <div class="table-scroll"><table class="trend-table">
      <thead><tr><th>日期</th><th>持股市值(兆)</th><th class="hide-m">持股比率</th><th>大台淨部位(億)</th><th>避險比例</th></tr></thead>
      <tbody>${tr}</tbody></table></div>
  </div>`;
}

// ================= 讀取資料（同網域 data/）＋盤後自動更新 =================
// 每次都向伺服器確認（no-cache）：檔案沒變只回 304，很省流量；有變就拿到最新版。
// 用各檔內容長度＋最後一行當「版本」，有變才重畫。
let CUR_REF = null, LAST_CHECK = 0, CSV_TEXT = {};
let FUT_ROWS = null, SPOT_ROWS = null, TXM_ROWS = null, MARGIN_ROWS = null, MTOP_ROWS = null, HOLD_ROWS = null, ETF_ROWS = null, TAIEX_ROWS = null;

async function fetchText(name) {
  const r = await fetch("data/" + name, { cache: "no-cache" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return CSV_TEXT[name] = await r.text();
}
async function getCsv(name) {
  const t = CSV_TEXT[name];
  if (t === undefined) throw new Error("讀取失敗");
  return parseCSV(t);
}
async function dataVersion(names) {
  const res = await Promise.allSettled(names.map(fetchText));
  return res.map((x, i) => x.status === "fulfilled" ? x.value.length + ":" + x.value.slice(-40) : names[i] + ":x").join("|");
}
const DATA_FILES = ["txo_oi.csv", "txo_strike_oi.csv", "fut_oi.csv", "tx_month_oi.csv", "spot_net.csv", "margin.csv", "margin_top.csv", "foreign_hold.csv", "etf_fut.csv", "taiex.csv"];
async function loadAll(ref) {
  const names = DATA_FILES;
  const [opt, strike, fut, txm, spot, mg, mtop, hold, etf, tai] = await Promise.allSettled(names.map(n => getCsv(n, ref)));
  if (opt.status === "fulfilled" && opt.value.length) { render(opt.value); renderTrend(opt.value); }
  else if (!CUR_REF) {
    const st = document.getElementById("status");
    st.textContent = "資料載入失敗：" + (opt.reason ? opt.reason.message : "CSV 是空的");
    st.classList.add("error");
  }
  if (strike.status === "fulfilled") { renderStrikeSection(strike.value); STRIKE_ROWS = strike.value; }
  if (opt.status === "fulfilled") OPT_ROWS = opt.value;
  TXM_ROWS = txm.status === "fulfilled" ? txm.value : (TXM_ROWS || []);
  if (tai.status === "fulfilled") TAIEX_ROWS = tai.value;
  if (mg.status === "fulfilled") MARGIN_ROWS = mg.value;
  if (fut.status === "fulfilled") { FUT_ROWS = fut.value; renderFutures(FUT_ROWS); }
  else if (!FUT_ROWS) document.getElementById("futBox").innerHTML = `<div class="note">資料載入失敗（fut_oi.csv）</div>`;
  if (spot.status === "fulfilled") { SPOT_ROWS = spot.value; renderSpot(SPOT_ROWS); }
  else if (!SPOT_ROWS) document.getElementById("spotBox").innerHTML = `<div class="note">資料載入失敗（spot_net.csv）</div>`;
  if (mg.status === "fulfilled") { MARGIN_ROWS = mg.value; renderMargin(); }
  else if (!MARGIN_ROWS) document.getElementById("marginBox").innerHTML = `<div class="note">尚無融資資料</div>`;
  if (mtop.status === "fulfilled") { MTOP_ROWS = mtop.value; renderMarginTop(); }
  if (hold.status === "fulfilled") HOLD_ROWS = hold.value;
  renderHedge();
  if (etf.status === "fulfilled") { ETF_ROWS = etf.value; renderEtfFut(); }
  try { renderSettle(); } catch (e) { console.error(e); }
  CUR_REF = ref;
}
function inAfterHoursWindow() {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Taipei", weekday: "short", hour: "2-digit", minute: "2-digit", hour12: false })
    .formatToParts(new Date()).map(x => [x.type, x.value]));
  const hm = p.hour + ":" + p.minute;
  return !["Sat", "Sun"].includes(p.weekday) && ((hm >= "14:20" && hm <= "15:50") || (hm >= "21:20" && hm <= "23:00"));
}
async function checkUpdate(force) {
  if (!force && Date.now() - LAST_CHECK < 60000) return;
  LAST_CHECK = Date.now();
  const ref = await dataVersion(DATA_FILES);
  if (force || ref !== CUR_REF) await loadAll(ref);
  const el = document.getElementById("lastChecked");
  const t = new Date().toLocaleTimeString("zh-Hant-TW", { hour12: false, timeZone: "Asia/Taipei", hour: "2-digit", minute: "2-digit" });
  el.textContent = (inAfterHoursWindow() ? "自動更新中・" : "") + "檢查於 " + t;
}
checkUpdate(true);
setInterval(() => { if (document.visibilityState === "visible" && inAfterHoursWindow()) checkUpdate(false); }, 90000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkUpdate(false); });

let resizeTimer = null, lastW = 0;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const w = chartW(); if (w === lastW) return; lastW = w;
    if (FUT_ROWS) renderFutures(FUT_ROWS);
    if (ETF_ROWS) renderEtfFut();
    if (SPOT_ROWS) renderSpot(SPOT_ROWS);
    if (MARGIN_ROWS) renderMargin();
    renderHedge();
  }, 200);
});

// ================= 分頁切換 =================
const UPDATE_NOTE = {
  options: "交易日約 14:50（期交所公布後 1 分鐘內）",
  settle: "週二、週四約 15:00（選擇權資料公布後）",
  futures: "交易日約 14:50（期交所公布後 1 分鐘內）",
  spot: "買賣超約 15:05；外資持股與避險比例約 21:30",
  margin: "交易日約 21:30（證交所公布融資後 1 分鐘內）",
};
function showTab(name) {
  document.getElementById("updateNote").textContent = UPDATE_NOTE[name] || "";
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
  document.querySelectorAll(".tab-panel").forEach(p => p.classList.toggle("active", p.id === "panel-" + name));
  try { localStorage.setItem("tab", name); } catch (e) {}
}
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
  showTab(b.dataset.tab);
  history.replaceState(null, "", "#" + b.dataset.tab);
}));
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  const btn = document.getElementById("themeToggle");
  btn.dataset.on = t;
  btn.setAttribute("aria-pressed", t === "light" ? "true" : "false");
  try { localStorage.setItem("theme", t); } catch (e) {}
}
document.getElementById("themeToggle").addEventListener("click", () =>
  setTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light"));
setTheme(document.documentElement.dataset.theme || "dark");
(function initTab() {
  let t = location.hash.slice(1);
  if (!t) { try { t = localStorage.getItem("tab") || ""; } catch (e) {} }
  showTab(["options", "settle", "futures", "spot", "margin"].includes(t) ? t : "options");
})();

// 版權年份：2026 起，跨年自動變成 2026–今年
(function () { const y = new Date().getFullYear(); document.getElementById("cpYear").textContent = y > 2026 ? "2026–" + y : "2026"; })();

// ================= 瀏覽人次 =================
(function visits() {
  const NS = "uptronyx-taifex", KEY = "visits";
  const today = new Date().toLocaleDateString("zh-TW");
  let seen = null;
  try { seen = localStorage.getItem("visitDay"); } catch (e) {}
  const url = `https://abacus.jasoncameron.dev/${seen === today ? "get" : "hit"}/${NS}/${KEY}`;
  fetch(url).then(r => r.ok ? r.json() : Promise.reject())
    .then(j => {
      if (typeof j.value !== "number") return;
      try { localStorage.setItem("visitDay", today); } catch (e) {}
      document.getElementById("visitCount").textContent = j.value.toLocaleString();
      document.getElementById("visitRow").style.display = "block";
    }).catch(() => {});
})();
